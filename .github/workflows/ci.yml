name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O menubar/theLAAP.swift -o /tmp/theLAAP -framework Cocoa -framework WebKit
