<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sostituito all'avvio del server: accompagna ogni richiesta che cambia
     stato, così una pagina aperta altrove non può comandare il pannello. -->
<meta name="thelaap-token" content="__TOKEN__">
<title>theLAAP — the local AI admin panel</title>
<style>
/* ────────────────────────────────────────────────────────────────
   theLAAP — sala macchine.
   Nessuna dipendenza: font di sistema, niente rete, niente build.
   I colori stanno tutti qui sotto; il resto del foglio li usa e basta.
   ──────────────────────────────────────────────────────────────── */
:root{
  --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --bg:oklch(0.966 0.004 240); --surface:oklch(1 0 0); --inset:oklch(0.936 0.005 240);
  --soft:oklch(0.947 0.028 215);
  --strong:oklch(0.24 0.012 245); --body:oklch(0.38 0.010 245); --muted:oklch(0.555 0.010 245);
  --line:oklch(0.885 0.006 245); --line2:oklch(0.805 0.010 245);
  --accent:oklch(0.55 0.105 215); --accent-ink:oklch(0.47 0.105 215);
  --ok:oklch(0.60 0.110 150); --ok-ink:oklch(0.46 0.100 150); --ok-bg:oklch(0.945 0.035 150);
  --warn:oklch(0.68 0.115 72); --warn-ink:oklch(0.50 0.100 72); --warn-bg:oklch(0.957 0.040 80);
  --bad:oklch(0.58 0.130 25); --bad-ink:oklch(0.49 0.130 25); --bad-bg:oklch(0.950 0.030 25);
  --code-bg:oklch(0.215 0.012 245); --code-fg:oklch(0.86 0.020 210);
  --s1:oklch(0.55 0.105 215); --s2:oklch(0.66 0.090 215); --s3:oklch(0.76 0.070 215); --s4:oklch(0.85 0.050 215);
  --on-fill:oklch(0.99 0 0); --on-pale:oklch(0.26 0.015 245);
}
html[data-theme="dark"]{
  --bg:oklch(0.208 0.008 245); --surface:oklch(0.248 0.009 245); --inset:oklch(0.292 0.009 245);
  --soft:oklch(0.315 0.038 215);
  --strong:oklch(0.98 0.003 245); --body:oklch(0.855 0.008 245); --muted:oklch(0.675 0.012 245);
  --line:oklch(0.335 0.012 245); --line2:oklch(0.435 0.015 245);
  --accent:oklch(0.62 0.110 215); --accent-ink:oklch(0.80 0.085 215);
  --ok:oklch(0.68 0.120 150); --ok-ink:oklch(0.82 0.110 150); --ok-bg:oklch(0.315 0.050 150);
  --warn:oklch(0.74 0.120 78); --warn-ink:oklch(0.84 0.110 78); --warn-bg:oklch(0.325 0.050 78);
  --bad:oklch(0.62 0.140 25); --bad-ink:oklch(0.78 0.120 25); --bad-bg:oklch(0.330 0.060 25);
  --code-bg:oklch(0.155 0.008 245); --on-pale:oklch(0.20 0.015 245);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--body);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent-ink);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

/* testata */
header{display:flex;align-items:center;gap:14px;height:52px;padding:0 14px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:none}
header .titolo{display:flex;flex-direction:column;gap:1px;min-width:0}
header .titolo b{font-family:var(--mono);font-size:13px;color:var(--strong);letter-spacing:.01em}
header .titolo span{font-size:11px;color:var(--muted);white-space:nowrap}
#apri-cmdk{display:flex;align-items:center;gap:9px;width:250px;height:32px;padding:0 9px 0 11px;
  background:var(--inset);border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--muted);
  font:13px var(--font)}
#apri-cmdk:hover{border-color:var(--line2);color:var(--body)}
#apri-cmdk span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;line-height:1}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.vivo{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.dot.vivo{animation:none}}

/* bottoni */
button{font:500 12.5px var(--font);border-radius:7px;cursor:pointer;border:1px solid transparent;
  background:transparent;color:var(--body);padding:0 12px;min-height:32px;transition:.12s}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.b1{background:var(--accent);color:var(--on-fill)}
.b2{border-color:var(--accent);color:var(--accent-ink)}
.b2:hover:not(:disabled){background:var(--soft)}
.b3:hover:not(:disabled){background:var(--inset)}
.bx{background:var(--bad);color:var(--on-fill)}
.bxq{color:var(--bad-ink)}
.bxq:hover:not(:disabled){background:var(--bad-bg)}
.sm{min-height:28px;padding:0 10px;font-size:12px}
.seg{display:inline-flex;padding:3px;background:var(--inset);border-radius:8px;gap:2px;flex:none}
.seg button{min-height:26px;padding:0 12px;border-radius:6px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px oklch(0.2 0.02 245/.14)}
.seg.mini button{min-height:20px;padding:0 8px;font-size:10px}
.scelta-riga{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.scelta-riga>.et{font-size:11px;color:var(--muted);min-width:62px}
.scelte{display:flex;gap:4px;flex-wrap:wrap}.scelte button{min-height:28px;padding:0 10px;border-color:var(--line);background:var(--surface);font-size:11.5px}
.scelte button.on{border-color:var(--accent);background:var(--soft);color:var(--accent-ink);font-weight:650}

/* pezzi comuni */
h1{margin:0 0 4px;font-size:25px;font-weight:600;color:var(--strong);letter-spacing:-.02em}
h2{margin:0;font-size:16px;font-weight:600;color:var(--strong)}
.sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.card>.testa{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.corpo{padding:16px 18px}
.riga{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.riga:first-child{border-top:0}
.riga .cresci{flex:1;min-width:0}
.riga .t{display:block;font-size:13px;font-weight:500;color:var(--strong)}
.riga .m{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);
  border:1px solid var(--line2);background:none;padding:4px 8px;border-radius:4px;white-space:nowrap;min-height:0;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.grigio{color:var(--muted);border-color:var(--line)}
.pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:0;min-height:0;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)} .p-acc{background:var(--soft);color:var(--accent-ink)}
.p-warn{background:var(--warn-bg);color:var(--warn-ink)} .p-bad{background:var(--bad-bg);color:var(--bad-ink)}
.p-neutro{background:var(--inset);color:var(--body)}
.nota{display:flex;gap:12px;padding:12px 15px;border:1px solid var(--line);border-left-width:3px;
  border-radius:8px;background:var(--surface);margin-bottom:14px}
.nota b{display:block;color:var(--strong);font-size:13px} .nota div>span{font-size:13px;line-height:1.5}
.n-ok{border-left-color:var(--ok)} .n-warn{border-left-color:var(--warn)}
.n-bad{border-left-color:var(--bad)} .n-info{border-left-color:var(--accent)}
input[type=text],input[type=search],input[type=password],input[type=number]{
  min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);
  color:var(--strong);font:13px var(--font);width:100%}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{width:100%;border:0;resize:vertical;min-height:320px;padding:14px 16px;background:var(--code-bg);
  color:var(--code-fg);font:11.5px/1.6 var(--mono);display:block}
textarea:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
pre.out{margin:0;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:14px 16px;font:11.5px/1.6 var(--mono)}
.vuoto{padding:48px 24px;text-align:center;color:var(--muted)}
.vuoto b{display:block;color:var(--strong);font-size:15px;margin-bottom:6px}
.carica{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);
  border-radius:50%;animation:gira .8s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}

/* inspector */
#insp .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;flex:none}
#insp .tabs button{border-bottom:2px solid transparent;border-radius:0;min-height:40px;color:var(--muted)}
#insp .tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent);margin-bottom:-1px}
.chiudi-insp{display:none;margin-left:auto;color:var(--muted)}
#insp .cont{flex:1;overflow-y:auto;padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.specs{display:grid;grid-template-columns:max-content 1fr;border:1px solid var(--line);border-radius:8px;
  overflow:hidden;flex:none}
.specs>div{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.specs>div:nth-child(odd){font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);background:var(--inset)}
.specs>div:nth-child(even){font-family:var(--mono);font-size:11px;color:var(--strong);border-left:1px solid var(--line)}
.specs>div:nth-last-child(-n+2){border-bottom:0}
.desc{border:1px solid var(--line2);border-radius:8px;padding:11px 13px;background:var(--inset)}
.desc p{margin:0;font-size:12.5px;line-height:1.55;color:var(--body);text-wrap:pretty}
.azioni{display:flex;flex-direction:column;gap:8px}
.azioni .due{display:flex;gap:8px} .azioni .due button{flex:1}
.msg{font-size:12.5px;line-height:1.5;padding:9px 12px;border:1px solid var(--line);border-radius:10px 10px 10px 2px;
  background:var(--inset);color:var(--body);text-wrap:pretty}
.msg.io{align-self:flex-end;max-width:88%;border-color:var(--accent);border-radius:10px 10px 2px 10px;
  background:var(--soft);color:var(--accent-ink)}
.msg.gellow-attesa{display:flex;align-items:center;gap:11px;border-color:var(--accent);background:var(--soft);color:var(--accent-ink)}
.gellow-gira{width:18px;height:18px;flex:none;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:gira .8s linear infinite}
.gellow-attesa b{display:block;font-size:12.5px}.gellow-attesa small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
.gellow-punti{display:inline-flex;gap:3px;margin-left:4px;vertical-align:2px}.gellow-punti i{width:4px;height:4px;border-radius:50%;background:currentColor;
  animation:gellow-lampeggia 1.05s infinite ease-in-out}.gellow-punti i:nth-child(2){animation-delay:.15s}.gellow-punti i:nth-child(3){animation-delay:.3s}
@keyframes gellow-lampeggia{0%,70%,100%{opacity:.2;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
.md p{margin:0 0 7px} .md p:last-child{margin:0}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px}
.md pre{background:var(--code-bg);color:var(--code-fg);border-radius:7px;padding:10px;overflow-x:auto;margin:7px 0}
.md pre code{background:none;border:0;padding:0;color:inherit}
.md ul{margin:6px 0;padding-left:18px} .md li{margin:2px 0} .md strong{font-weight:650}

/* piede */
footer{height:30px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;
  background:var(--surface);border-top:1px solid var(--line)}
footer .metriche{display:flex;gap:14px;flex:1;min-width:0;overflow:hidden;align-items:baseline}
footer .metriche span{white-space:nowrap}
footer .metriche b{font-family:var(--mono);font-size:11px;color:var(--strong);font-weight:400}
/* Nella finestra dell'app (1180 px) le cinque metriche non ci stanno e l'ultima
   veniva tagliata a metà — un indirizzo troncato è peggio di un indirizzo
   assente. Soglia e tetto sono già scritti nella scheda «Regola», quindi sono
   loro a cedere il posto, non l'indirizzo. */
@media(max-width:1340px){footer .opz{display:none}}

/* palette */
#velo{position:fixed;inset:0;background:oklch(0.20 0.02 245/.55);display:none;align-items:flex-start;
  justify-content:center;padding-top:11vh;z-index:100}
#velo.on{display:flex}
#cmdk{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 30px 70px oklch(0.14 0.01 245/.35);overflow:hidden}
#cmdk .campo{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line)}
#cmdk .campo input{flex:1;width:100%;min-width:0;border:0;background:none;font-size:15px;min-height:0;padding:0}
#cmdk .campo input:focus{box-shadow:none}
#cmdk .capito{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 18px;
  border-bottom:1px solid var(--line);background:var(--inset)}
#cmdk .capito .v{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--soft);padding:4px 8px;border-radius:4px;white-space:nowrap}
#cmdk .prop{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#cmdk .prop b{display:block;font-size:13px;color:var(--strong)}
#cmdk .prop .c{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
#cmdk .prop .w{font-size:11.5px;color:var(--warn-ink);margin-top:5px}
#cmdk .vedo{padding:10px 18px 12px;border-bottom:1px solid var(--line)}
#cmdk .vedo button{display:flex;width:100%;text-align:left;gap:9px;align-items:flex-start;padding:6px 0;min-height:0}
#cmdk .vedo .fr{color:var(--accent-ink);font-family:var(--mono);font-size:11px;padding-top:3px;flex:none}
#cmdk .vedo b{display:block;font-size:13px;color:var(--strong);font-weight:500}
#cmdk .vedo i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}
#cmdk .lista{max-height:280px;overflow-y:auto;padding:6px}
#cmdk .lista button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;
  border-radius:7px;font-weight:400;font-size:13px}
#cmdk .lista button:hover,#cmdk .lista button.sel{background:var(--soft);color:var(--accent-ink)}
#cmdk .lista button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cmdk .piede{display:flex;gap:18px;padding:9px 18px;border-top:1px solid var(--line);background:var(--inset);
  font-size:10px;color:var(--muted)}
#cmdk .piede span{white-space:nowrap}
svg.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}

.barra-risultato{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 9px;
  padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.barra-risultato .titolo-risultato{display:flex;flex-direction:column;gap:2px;min-width:180px;margin-right:auto}
.barra-risultato .titolo-risultato b{font-size:13px;color:var(--strong)}
.barra-risultato .titolo-risultato span{font-size:11.5px;color:var(--muted)}
.barra-risultato button{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.filtri-hf{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;margin:0 0 14px}
.filtri-hf .base{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filtri-hf .scelte-hf{display:flex;flex-direction:column;gap:9px;width:100%}
.filtri-hf label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.filtri-hf select,.filtri-hf input{min-height:32px;font-size:12px;background:var(--surface)}
.filtri-hf select{width:auto;min-width:135px}
.filtri-hf input[type=number]{width:112px}
.filtri-hf .apri-filtri{width:100%;border-top:1px solid var(--line);border-radius:0;text-align:left;margin-top:2px;padding:9px 0 0;color:var(--accent-ink);min-height:30px}
.filtri-hf .avanzati{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:10px}
.hf-meta{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--muted)}
.hf-meta span{white-space:nowrap}.hf-meta .trend{color:var(--accent-ink)}
.config-riga{display:grid;grid-template-columns:minmax(220px,1fr) 120px 70px 110px 90px 105px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.config-riga:first-child{border-top:0}.config-riga .check{text-align:center}.config-riga input{width:18px;min-height:18px}
.config-head{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--inset)}
.esito-semplice{background:var(--code-bg);color:var(--code-fg);border-radius:9px;padding:14px;white-space:pre-wrap;line-height:1.5;max-height:420px;overflow:auto;font-family:var(--mono);font-size:11.5px}

/* Le serie dei programmi nel grafico della memoria: otto tinte in ordine
   fisso, lo stesso in chiaro e in scuro. L'ordine non è estetica: è ciò che
   tiene distinguibili due vicine anche a chi non vede i colori (verificato
   col validatore, non a occhio). Il colore segue il programma, non la sua
   posizione: spegnerne uno non ridipinge gli altri. */
:root{--serie-1:#2a78d6;--serie-2:#eb6834;--serie-3:#1baf7a;--serie-4:#eda100;--serie-5:#e87ba4;
  --serie-6:#008300;--serie-7:#4a3aa7;--serie-8:#e34948;--serie-altro:oklch(0.70 0.010 245)}
html[data-theme="dark"]{--serie-1:#3987e5;--serie-2:#d95926;--serie-3:#199e70;--serie-4:#c98500;--serie-5:#d55181;
  --serie-6:#008300;--serie-7:#9085e9;--serie-8:#e66767;--serie-altro:oklch(0.55 0.012 245)}

/* corpo a tre colonne: a sinistra la navigazione, al centro la pagina, a
   destra l'ispettore — il modello scelto oppure Gellow — che si apre quando
   serve e non tiene occupata una colonna vuota. */
main{display:grid;grid-template-columns:224px minmax(0,1fr);flex:1;min-height:0}
main.insp-aperto{grid-template-columns:224px minmax(0,1fr) 340px}
#lato{background:var(--bg);border-right:1px solid var(--line);padding:12px 8px 8px;overflow-y:auto;
  display:flex;flex-direction:column;gap:2px}
.voce{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border:0;border-radius:7px;
  background:transparent;color:var(--body);font:500 13px var(--font);cursor:pointer;text-align:left}
.voce:hover{background:var(--inset)}
.voce.on{background:var(--soft);color:var(--accent-ink)}
.voce svg{width:17px;height:17px;flex:none;opacity:.7}
.voce .nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voce .n,.seg .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.gruppo{padding:14px 11px 5px}
#btn-aiuto{display:inline-flex;align-items:center;gap:7px}
#centro{overflow-y:auto;padding:18px 22px 32px;min-width:0}
.pagina{max-width:1180px;margin:0 auto}
#insp{display:none;background:var(--surface);border-left:1px solid var(--line);flex-direction:column;min-height:0}
main.insp-aperto #insp{display:flex}
.chiudi-insp{display:block}
.strumenti{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
/* le schede sopra la tabella: se non ci stanno su una riga vanno a capo */
.strumenti .seg{flex:0 1 auto;flex-wrap:wrap}
.strumenti .seg button{padding:0 10px}
/* le azioni accanto alle schede restano insieme, a destra: se manca il posto
   vanno a capo tutte, non una sola */
.strumenti-azioni{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.et{font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:6px;
  background:var(--inset);color:var(--body);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.ib{min-height:28px;width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:hover:not(:disabled){background:var(--inset);color:var(--strong)}

/* i numeri in testa: un'etichetta e un valore, niente altro */
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi>div{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px;min-width:0}
.kpi .v{display:block;font-size:22px;font-weight:600;color:var(--strong);letter-spacing:-.01em;margin-top:1px;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}

/* la memoria: una barra impilata, un programma per segmento. Lo stacco fra i
   segmenti è lo sfondo che passa, non un bordo disegnato. */
.mem{margin:0 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:13px 14px 11px}
.mem-barra{position:relative;display:flex;gap:2px;height:22px}
.mem-seg{height:100%;min-width:3px;transition:width .4s}
.mem-seg:hover,.mem-seg:focus-visible{filter:brightness(1.14);outline:none}
.mem-libero{flex:1;min-width:0;background:var(--inset)}
.mem-altro{background:var(--line2)}
.mem-riserva{height:100%;background:repeating-linear-gradient(135deg,var(--line2) 0 2px,var(--inset) 2px 6px)}
.mem-barra>:last-child{border-radius:0 4px 4px 0}
.mem-tetto{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--strong)}
.mem-asse{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:10px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.legenda{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--body)}
.legenda span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legenda i,.quadro{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.legenda b{font-weight:600;color:var(--strong);font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:200;pointer-events:none;display:none;background:var(--code-bg);color:var(--code-fg);
  border-radius:7px;padding:6px 9px;font-size:11.5px;line-height:1.4;max-width:320px;
  box-shadow:0 6px 20px oklch(0.14 0.01 245/.3)}
#tip b{display:block;color:oklch(0.98 0 0);font-size:12.5px}

/* avvisi e conferme: una riga ciascuno */
.avvisi{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.avviso{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 11px;border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:8px;background:var(--surface);font-size:12.5px}
.avviso.grave{border-left-color:var(--bad)}
.avviso>span{flex:1;min-width:0;overflow-wrap:anywhere}
.conferma{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;
  border:1px solid var(--warn);border-radius:10px;background:var(--warn-bg);color:var(--strong)}

/* la tabella: programmi come gruppi, modelli come righe */
.tab{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:14px}
.tab-testa,.tab-riga{display:grid;grid-template-columns:44px minmax(200px,1.7fr) minmax(150px,.9fr) 76px 150px 60px 108px;
  gap:12px;align-items:center;padding:0 14px}
.tab-testa{min-height:32px;background:var(--inset);border-bottom:1px solid var(--line)}
.tab-testa button{min-height:0;padding:0;border:0;text-align:left;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tab-testa button.on{color:var(--accent-ink)}
.tab-gruppo{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 8px 0 14px;
  border-top:1px solid var(--line);background:var(--bg)}
.tab-testa+.tab-gruppo,.tab-gruppo:first-child{border-top:0}
.tab-gruppo .nome{font-weight:650;color:var(--strong);white-space:nowrap}
.q{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-riga{min-height:46px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.tab-riga:hover{background:var(--inset)}
.tab-riga.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.principale{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--strong);line-height:1.3;min-width:0}
.principale>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stella{color:var(--warn);font-size:12px;flex:none;line-height:1}
.pref.on{color:var(--warn-ink)}
.secondaria{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* «per cosa usarlo»: una frase, non un identificativo — carattere normale e fino a due righe */
.secondaria.per{font-family:var(--font);font-size:11px;line-height:1.35;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.num{font-family:var(--mono);font-size:11.5px;color:var(--strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{color:var(--warn-ink);font-size:10.5px}
.peso{display:flex;flex-direction:column;gap:4px;min-width:0}
/* il binario è un gradino più chiaro della stessa tinta del riempimento, così
   lo stato si legge su tutta la barra e non solo sulla parte piena */
.metro{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.metro i{display:block;height:100%;background:var(--accent)}
.metro.no{background:var(--warn-bg)} .metro.no i{background:var(--warn)}
.cl{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 5px;margin-right:3px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);opacity:.5}
.cl.on{border-color:var(--accent);color:var(--accent-ink);background:var(--soft);opacity:1}

/* l'interruttore di un modello. Acceso e spento si distinguono dalla posizione
   del pomello, non solo dal colore. */
.sw{position:relative;width:38px;height:22px;min-height:0;padding:0;border-radius:999px;border:1px solid var(--line2);
  background:var(--inset);flex:none;display:block}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 2px oklch(0.2 0.02 245/.35);transition:left .15s}
.sw.on{background:var(--ok);border-color:var(--ok)} .sw.on i{left:18px}
.sw.busy i{box-shadow:none;background:none;border:2px solid var(--line2);border-top-color:var(--accent);
  animation:gira .8s linear infinite}

/* tabelle semplici: comandi, registro, verifiche */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:400;text-align:left;padding:8px 14px;background:var(--inset);border-bottom:1px solid var(--line)}
table.t td{padding:8px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.t tbody tr:first-child td{border-top:0}
table.t td.n{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.az{text-align:right;white-space:nowrap}
table.t td b{color:var(--strong);font-weight:600}

/* finestre piccole: l'ispettore diventa un pannello sopra la pagina, poi la
   tabella perde le colonne che non servono a decidere. Le media query stanno
   in fondo perché vincano sulle regole base. */
@media(max-width:1180px){
  main.insp-aperto{grid-template-columns:224px minmax(0,1fr)}
  main.insp-aperto #insp{position:fixed;z-index:80;right:10px;top:58px;bottom:38px;
    width:min(390px,calc(100vw - 20px));border:1px solid var(--line2);border-radius:12px;
    box-shadow:0 24px 70px oklch(0.14 0.01 245/.28)}
  main.insp-aperto::after{content:"";position:fixed;z-index:70;inset:50px 0 30px;background:oklch(0.18 0.01 245/.18)}
}
/* col dettaglio aperto a fianco la tabella è stretta: tiene nome, uso e peso.
   Contesto, velocità e client del modello scelto si leggono nel dettaglio. */
@media(min-width:1181px) and (max-width:1560px){
  main.insp-aperto .tab-testa,main.insp-aperto .tab-riga{grid-template-columns:44px minmax(160px,1.7fr) minmax(110px,.9fr) 130px}
  main.insp-aperto .c-ctx,main.insp-aperto .c-tok,main.insp-aperto .c-cl{display:none}
}
@media(max-width:1000px){
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab-testa{display:none}
  .tab-riga{grid-template-columns:44px minmax(0,1fr) 112px;padding:7px 12px}
  .c-uso,.c-ctx,.c-tok,.c-cl{display:none}
  .config-riga{grid-template-columns:minmax(150px,1fr) 55px 75px 65px 85px}.config-riga>*:nth-child(2){display:none}
}
/* ancora più stretto: la navigazione resta, ridotta alle icone */
@media(max-width:820px){
  main,main.insp-aperto{grid-template-columns:52px minmax(0,1fr)}
  #lato{padding:10px 6px} .voce{padding:9px 0;justify-content:center} .voce .nome,.voce .n,.gruppo{display:none}
  header .titolo span{display:none} #apri-cmdk{width:auto;min-width:44px} #apri-cmdk span{display:none}
}
</style>
</head>
<body>

<header>
  <div class="titolo">
    <b>theLAAP</b>
    <span id="che-cos-e">The local AI admin panel</span>
  </div>
  <div class="sp"></div>
  <button id="apri-cmdk" onclick="apriCmdk(true)">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <span id="cmdk-invito">Ask or command</span><kbd>⌘K</kbd>
  </button>
  <button class="b2" style="padding:0 10px" onclick="vaiTab('aiuto')" id="btn-aiuto"
          title="Open Gellow" aria-label="Open Gellow" aria-controls="insp" aria-expanded="false">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a3 3 0 0 1-3 3H9l-5 3v-6a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/><circle cx="8" cy="10.5" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="10.5" r=".8" fill="currentColor" stroke="none"/><circle cx="16" cy="10.5" r=".8" fill="currentColor" stroke="none"/></svg>
    <span id="testo-aiuto">Gellow</span><span class="dot" id="gellow-dot"></span>
  </button>
</header>

<main>
  <nav id="lato" aria-label="Sections"></nav>
  <section id="centro"><div class="vuoto"><span class="carica"></span></div></section>
  <aside id="insp">
    <div class="tabs">
      <button id="tab-modello" class="on" onclick="vaiTab('modello')">Model</button>
      <button id="tab-aiuto" onclick="vaiTab('aiuto')">Gellow</button>
      <button class="chiudi-insp" onclick="chiudiInsp()" aria-label="Chiudi" title="Chiudi">×</button>
    </div>
    <div class="cont" id="insp-corpo"></div>
  </aside>
</main>
<div id="tip" role="tooltip"></div>

<footer>
  <div class="metriche" id="metriche"></div>
  <div class="seg mini" id="seg-tema"></div>
  <div class="seg mini" id="seg-lingua"></div>
</footer>

<div id="velo" onclick="if(event.target===this)apriCmdk(false)">
  <div id="cmdk">
    <div class="campo">
      <svg class="ico" viewBox="0 0 24 24" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="disegnaCmdk()" onkeydown="tastiCmdk(event)">
      <kbd>esc</kbd>
    </div>
    <div id="cmdk-corpo"></div>
    <div class="piede" id="cmdk-piede"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   1. lingua e testi. Inglese di default, italiano a un clic.
   ════════════════════════════════════════════════════════════════ */
const L = {
en:{whatItIs:"The local AI admin panel",ask:"Ask or command",models:"Models",archive:"Archive",used:"used",
  free:"free",stale:"numbers frozen for",ceiling:"ceiling for one model",ceilingShort:"single ceiling",
  ceilingOf:"ceiling of",ceilingWhy:"the largest model it accepts right now: it changes with free memory",
  threshold:"coexistence threshold",colModel:"Model",colWeight:"Weight",colContext:"Context",noneHere:"Nothing in this group",
  addHF:"Add from HuggingFace",stopAll:"Stop everything",startAll:"Start everything",
  pressAgain:"Press again to confirm",on:"on",off:"off",restart:"Restart",turnOn:"Start",turnOff:"Stop",
  run:"Run",output:"Output",clear:"Clear",search:"Search",searchPh:"qwen coder, gemma, deepseek",

  send:"Send",cmdkPh:"A command, or what you want: free 40 gb",understood:"Understood",commands:"Commands",
  alsoThese:"Also these",confirm:"Confirm",footChoose:"up down to pick",footRun:"enter to run",
  footClose:"esc to close",footLocal:"read here, no network",themeAuto:"Auto",themeLight:"Light",
  themeDark:"Dark",kClass:"class",kWeight:"weight",kSpeed:"speed",kCtx:"context",kProg:"program",
  kReason:"reasons",kClients:"clients",elsewhere:"runs elsewhere",yourName:"Your own name",
  menuName:"Name in the client menus",serverId:"Id for the server",idWarn:"getting it wrong makes it silent",
  inPi:"in the Pi menu",inOC:"in the OpenCode menu",inDSH:"in the DeepSeek Harness menu",
  saveChanges:"Save changes",unsaved:"unsaved changes",keyLabel:"Provider key",keyNew:"new key",
  keySave:"Save and check",noModels:"No model configured",noTools:"No maintenance script found",
  noArchive:"Nothing archived",offline:"The panel cannot reach the server",available:"free for a new model",
  reserved:"kept for the system",favorites:"Favorites",favorite:"Favorite",favAdd:"Add to favorites",
  favRemove:"Remove from favorites",noFavorites:"No favorites yet",otherApps:"other apps",
  otherAppsWhy:"used by the rest of the Mac: not free for a model",
  noFavoritesHow:"Open a model and press ☆ Add to favorites.",
  st:{pronto:"active","in-memoria":"in memory",spento:"off","in-arrivo":"incoming",guasto:"faulty",remoto:"remote"},
  cl:{convivente:"coexisting",esclusivo:"exclusive",residente:"resident",remoto:"remote",ignota:"weight unknown"}},
it:{whatItIs:"Il pannello di amministrazione dell'AI locale",ask:"Chiedi o comanda",models:"Modelli",
  archive:"Archivio",used:"occupati",free:"liberi",stale:"numeri fermi da",ceiling:"tetto per un solo modello",
  ceilingShort:"tetto singolo",threshold:"soglia convivenza",colModel:"Modello",colWeight:"Peso",colContext:"Contesto",
  ceilingOf:"tetto di",ceilingWhy:"il modello più grande che accetta adesso: cambia con la memoria libera",
  noneHere:"In questo gruppo non c'è niente",addHF:"Aggiungi da HuggingFace",stopAll:"Ferma tutto",
  startAll:"Riaccendi tutto",pressAgain:"Premi di nuovo per confermare",on:"acceso",off:"spento",
  restart:"Riavvia",turnOn:"Accendi",turnOff:"Spegni",run:"Esegui",output:"Output",clear:"Pulisci",
  search:"Cerca",searchPh:"qwen coder, gemma, deepseek",download:"Scarica",onDisk:"già qui",save:"Salva",
  format:"Formatta",check:"Controlla",validJSON:"JSON valido",invalidJSON:"JSON non valido",restore:"Ripristina",
  del:"Elimina",tabModel:"Modello",tabHelp:"Gellow",testTime:"Cronometra",namesClients:"Nomi e client",
  archiveBtn:"Archivia",askPh:"Chiedi a Gellow",send:"Invia",cmdkPh:"Un comando, o cosa vuoi: libera 40 giga",
  understood:"Capito",commands:"Comandi",alsoThese:"Anche questi",confirm:"Conferma",
  footChoose:"su giù per scegliere",footRun:"invio per eseguire",footClose:"esc per chiudere",
  footLocal:"letto qui, senza rete",themeAuto:"Auto",themeLight:"Chiaro",themeDark:"Scuro",kClass:"classe",
  kWeight:"peso",kSpeed:"velocità",kCtx:"contesto",kProg:"programma",kReason:"ragiona",kClients:"client",
  elsewhere:"gira altrove",yourName:"Come lo chiami tu",menuName:"Nome nei menu dei client",
  serverId:"Id per il server",idWarn:"sbagliarlo lo rende muto",inPi:"nel menu di Pi",
  inOC:"nel menu di OpenCode",inDSH:"nel menu di DeepSeek Harness",saveChanges:"Salva le modifiche",
  unsaved:"modifiche non salvate",keyLabel:"Chiave del provider",keyNew:"chiave nuova",
  keySave:"Salva e verifica",noModels:"Nessun modello configurato",
  noTools:"Nessuno script di manutenzione trovato",noArchive:"Archivio vuoto",
  offline:"Il pannello non raggiunge il server",available:"liberi per un modello nuovo",
  reserved:"tenuti per il sistema",favorites:"Preferiti",favorite:"Preferito",favAdd:"Aggiungi ai preferiti",
  favRemove:"Togli dai preferiti",noFavorites:"Nessun preferito",otherApps:"altre app",
  otherAppsWhy:"usata dal resto del Mac: non è libera per un modello",
  noFavoritesHow:"Apri un modello e premi ☆ Aggiungi ai preferiti.",
  st:{pronto:"attivo","in-memoria":"in memoria",spento:"spento","in-arrivo":"in arrivo",guasto:"guasto",remoto:"remoto"},
  cl:{convivente:"convivente",esclusivo:"esclusivo",residente:"residente",remoto:"remoto",ignota:"peso ignoto"}}
};
/* La lingua: quella scelta, altrimenti quella del browser, altrimenti inglese.
   Non è pignoleria: `cosa`, `nota` e gli avvisi arrivano dal server e dalla
   configurazione, e sono scritti in italiano. Partire in inglese su una
   macchina italiana dà una schermata mista — metà tradotta, metà no. Chi ha un
   browser in un'altra lingua vede l'inglese, e il pulsante IT/EN resta lì. */
let LINGUA = localStorage.getItem('lingua')
  || (String(navigator.language||'').toLowerCase().startsWith('it') ? 'it' : 'en');
const T = () => L[LINGUA];
const IT = () => LINGUA === 'it';

/* ════════════════════════════════════════════════════════════════
   2. plumbing: token, fetch, escape. Come nella versione precedente:
   il token viaggia solo con le richieste che cambiano stato.
   ════════════════════════════════════════════════════════════════ */
const TOKEN = (document.querySelector('meta[name="thelaap-token"]')||{}).content || '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gb = v => (Number(v)||0).toFixed(1).replace('.', IT()?',':'.');
/* Un argomento dentro un attributo onclick.
   JSON.stringify emette virgolette DOPPIE, che chiudono l'attributo: il
   gestore diventa spazzatura e l'elemento non risponde al clic. Succedeva su
   dieci elementi, fra cui ogni riga della tabella dei modelli. Qui la stringa
   esce fra apici singoli, sfuggita prima per JavaScript e poi per l'HTML. */
const arg = v => "'" + String(v ?? '')
  .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n')
  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') + "'";
const $ = id => document.getElementById(id);
/* Il token va anche sulle GET: /api/grezzo, /api/documento e /api/documenti
   restituiscono i file di configurazione, e quelli lo chiedono in lettura.
   Prima le GET ne erano escluse, e con quelle rotte aperte bastava farsi
   passare per same-origin per leggere le chiavi dei provider. */
function conToken(o){
  o = o || {};
  const h = {'X-theLAAP-Token':TOKEN};
  if(o.method && o.method.toUpperCase()!=='GET') h['Content-Type']='application/json';
  o.headers = Object.assign(h, o.headers||{});
  return o;
}
async function api(p,o){
  const r = await fetch(p, conToken(o));
  const testo = await r.text();
  let dati = null; try{ dati = testo ? JSON.parse(testo) : null; }catch(e){}
  if(!r.ok){ const e = new Error((dati&&dati.errore)||testo||('HTTP '+r.status)); e.status=r.status; e.dati=dati; throw e; }
  return dati;
}

/* ════════════════════════════════════════════════════════════════
   3. stato del pannello. Tutto quello che arriva dal server sta qui.
   ════════════════════════════════════════════════════════════════ */
const S = {
  schermo:'home', filtro:localStorage.getItem('filtro-modelli')||'recenti', sel:null, tab:'modello', inspAperto:false,
  ordineModelli:localStorage.getItem('ordine-modelli')||'attivi',
  ordineConfigurazioni:localStorage.getItem('ordine-configurazioni')||'configurati',
  tema: localStorage.getItem('tema')||'auto',
  armato:'', cambiato:false, offline:false, archiviando:'', erroreArchivio:'', esameArchivio:null,
  mem:null, mod:null, modelli:[], runtime:[], capacita:{}, provider:{}, cred:{},
  regimi:[], strumenti:[], comandi:[], aiuto:null, autonomia:null, descrivendo:'', provando:'',
  /* commutando: gli interruttori in movimento, per id di modello (o `p:chiave`
     per un programma). esito: com'è finito l'ultimo gesto, a campi — la pagina
     lo disegna, non lo racconta. */
  commutando:{}, esito:{},
  gellowOccupato:false, gellowDal:0, gellowScroll:'', nomiAperti:null, prefLocali:{},
  archivio:[], documenti:[], doc:null, docRev:'', hf:[], scarichi:[], configErrori:[],
  hfCercato:false, hfCercando:false, hfQuery:'', hfErrore:'', copiato:false,
  hfSort:'trendingScore', hfFormato:'tutti', hfMemoria:'tutti', hfEta:'tutte',
  hfAutore:'', hfMinLikes:0, hfMinDownloads:0, hfMinGB:0, hfMaxGB:0,
  hfFiltriAperti:false, hfRichiesta:0,

};

/* ────────────────────────────────────────────────────────────────
   I numeri della macchina e il giudizio sui modelli arrivano da
   /api/modelli (states.go), che li calcola dove stanno già le misure.
   Qui NON si ricalcola niente: se la pagina rifacesse la soglia a modo
   suo, direbbe «convivente» su un modello che l'arbitro rifiuta.
   ──────────────────────────────────────────────────────────────── */
const M = () => S.mod || {};
const totaleGB = () => M().totaleGB || 0;
const occupatiGB = () => M().occupatiGB || 0;
const liberiGB = () => M().liberiGB || 0;           /* totale meno occupati: la barra */
const disponibiliGB = () => M().disponibiliGB || 0; /* tolta la riserva: ci sta o no  */
const riservaGB = () => M().riservaGB || 0;
const sogliaGB = () => Math.round(M().sogliaGB || 0);
const tettoGB  = () => Math.round(M().tettoGB || 0); /* 0 = il programma non lo dichiara */

/* la macchina a stati: una lettura, non un calcolo */
const statoDi = m => m.stato || 'spento';
const classeDi = m => m.classe || 'convivente';
const remotoDi = m => m.classe==='remoto' || m.stato==='remoto';
/* «un modello ready e basta»: lo sceglie il server, e ce n'è sempre uno solo. */
function prontoId(){ const p = S.modelli.find(m => m.pronto); return p ? p.id : null; }

/* «se lo carico adesso, ci sta?» — risponde l'arbitro di budget.go, che è lo
   stesso che risponde al preflight. Senza verdetto il modello è già in RAM,
   oppure non ne conosciamo il peso, e la domanda non ha senso. */
const haVerdetto = m => !!m.verdetto;
const ciSta = m => !m.verdetto || !!m.verdetto.ammesso;
const mancanoGB = m => m.verdetto ? (m.verdetto.mancanoByte||0)/1e9 : 0;
const daFermare = m => (m.verdetto && m.verdetto.daLiberare) || [];
const nomeRuntime = k => { const r = S.runtime.find(x=>x.chiave===k); return (r&&r.nome)||(S.provider[k]||{}).nome||k; };

/* Il nome principale deve identificare il modello, non ripetere una frase
   inventata dal modellino. Le vecchie etichette automatiche (per esempio
   «Analisi delle regole» su DeepSeek) restano modificabili, ma non possono più
   nascondere ciò che c'è davvero sotto. */
function nomeReale(m){
  let n=String(m.nome||'').trim(), id=String(m.id||'');
  if(n && n!==id){
    if(n.includes('—')){
      /* «daily — Tutti i giorni…»: prima del trattino c'è l'identificativo, quindi
         il nome è quello e il resto è una descrizione, non un nome */
      if(n.split('—')[0].trim().toLowerCase()===id.toLowerCase()) return id;
      n=n.split('—').slice(1).join('—').trim();
    }
    n=n.split('·')[0].trim();
    if(n) return breve(n,58);
  }
  return cortoDi({id:id}) || id;
}
const titoloDi = m => nomeReale(m);
/* Per i pulsanti. I nomi nei file dei client sono frasi intere — «CHAT-FAST —
   Gemma 4 26B-A4B MLX 8-bit (MoE, 4B attivi) · 86,5 tok/s misurati · per la
   chat quotidiana» — e dentro un pulsante diventano un paragrafo. Nelle righe
   ci pensa il CSS con l'ellissi; qui no, perché il pulsante si allarga. */
const breve = (t, n) => { t = String(t||''); n = n||30; return t.length>n ? t.slice(0,n-1).trimEnd()+'…' : t; };
/* La parte che distingue: dopo l'ultimo `/` oppure `--`, perché i pacchetti MLX
   usano il doppio trattino dove HuggingFace usa la barra —
   «lmstudio-community--gemma-4-E2B-it-MLX-8bit» è 43 caratteri di cui i primi 20
   sono il publisher, e tagliando solo sulla barra restava tutto e veniva troncato
   proprio dove inizia l'informazione. */
const cortoDi = m => {
  let s = String(m.id);
  const i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('--')+1);
  if(i > 0) s = s.slice(i+1);
  return s.length>30 ? s.slice(0,29)+'…' : s;
};
const modelloSel = () => S.modelli.find(m => m.id===S.sel) || S.modelli[0] || null;

const accesoDi = m => ['pronto','in-memoria'].includes(statoDi(m));
/* usato di recente: acceso adesso, oppure visto in memoria negli ultimi 30 giorni */
function recente(m){ return accesoDi(m) || (!!m.ultimoUso && Date.now()-Date.parse(m.ultimoUso) < 30*864e5); }
/* il contesto in migliaia di token; niente numero per gli strumenti (OCR, ricerca, conversione), dove non è una scelta */
function contestoDi(m){ return (m.context && !automatico(m)) ? Math.round(m.context/1000)+'k' : '—'; }
/* che cosa accetta in ingresso, come lo dichiarano i client ('image', 'text'…) */
function accetta(m,cosa){ return (m.ingressi||[]).includes(cosa); }
const processoDi = k => ((S.mem&&S.mem.processi)||[]).find(p=>p.chiave===k);

/* Il verdetto dell'arbitro a pezzi, non a frasi: quanto serve, quanto c'è,
   quanto manca, chi spegnere. I numeri e i nomi sono i suoi. */
function datiVerdetto(v){
  if(!v) return [];
  const d=[(IT()?'serve ':'needs ')+gb((v.richiestoByte||0)/1e9)+' GB',
           (IT()?'liberi ':'free ')+gb((v.disponibileByte||0)/1e9)+' GB'];
  if(!v.ammesso && v.mancanoByte) d.push((IT()?'mancano ':'missing ')+gb(v.mancanoByte/1e9)+' GB');
  if(!v.ammesso && (v.daLiberare||[]).length) d.push((IT()?'da spegnere: ':'to stop: ')+v.daLiberare.map(nomeRuntime).join(', '));
  return d;
}

/* ════════════════════════════════════════════════════════════════
   4. dalle parole al comando. Deterministico, nessun modello,
   nessuna rete: serve solo a ⌘K.
   ════════════════════════════════════════════════════════════════ */
/* VERBI: le sole azioni che questa pagina implementa da sé. Nessuna di queste
   finisce in una shell: sono navigazioni e chiamate alle rotte già esistenti. */
const VERBI = [
{id:'pronto',gruppo:'models',en:"Turn a model on",it:"Accendi un modello",
  p:['pronto','carica','usa','attiva','accendi','voglio','passa a','ready','load','use','want','switch','turn on','start']},
{id:'spegni',gruppo:'models',en:"Turn a model off",it:"Spegni un modello",
  p:['spegni','disattiva','scarica dalla','togli','libera','turn off','unload','stop','free']},
{id:'prova',gruppo:'models',en:"Time a model",it:"Cronometra un modello",
  p:['prova','misura','velocita','cronometra','test','bench','speed','how fast']},
{id:'hf',gruppo:'catalog',en:"Search HuggingFace",it:"Cerca su HuggingFace",
  p:['huggingface','hf','scarica','cerca modello','trova','download','search model','find']},
{id:'config',gruppo:'files',en:"Open the config files",it:"Apri i file di configurazione",
  p:['config','configurazione','json','yaml','file','modifica','edit']},
{id:'chiedi',gruppo:'help',en:"Ask Gellow",it:"Chiedi a Gellow",
  p:['perche','spiega','come faccio','aiuto','why','explain','what does','how do i','help']}
];
const nomeCmd = c => (IT() ? c.it : c.en) || c.en || c.it;

/* parole per cercare un comando che la pagina non conosce: si ricavano dall'id
   e dal nome che ha scritto chi ha compilato la configurazione. Dalla
   descrizione NON si prende niente: è prosa, e le sue parole generiche fanno
   vincere il comando sbagliato. */
const SENZA_ACCENTI = t => String(t||'').toLowerCase()
  .replace(/[àèéìòùç]/g, c => ({'à':'a','è':'e','é':'e','ì':'i','ò':'o','ù':'u','ç':'c'}[c]));
const TROPPO_COMUNI = new Set(['modello','modelli','model','models','programma','programmi',
  'program','programs','memoria','memory','regime','questo','questa','come','ogni','tutti',
  'tutto','tutte','serve','senza','della','delle','degli','sono','anche','dopo','prima',
  'oltre','quello','quella','with','from','that','this','only','more']);
function paroleDi(c){
  const grezze = SENZA_ACCENTI(c.id+' '+(c.nome||''))
    .split(/[^a-z0-9]+/).filter(w => w.length > 3 && !TROPPO_COMUNI.has(w));
  return Array.from(new Set(grezze));
}

/* Il registro: i verbi della pagina più i comandi che il server dichiara in
   /api/comandi. Una fonte sola per gli id eseguibili — la stessa che legge la
   voce nella barra dei menu. */
function registro(){
  const dal = (S.comandi||[]).map(c => {
    let nome = c.nome;
    if(c.gruppo === 'regime'){
      const g = S.regimi.find(x => 'regime:'+x.chiave === c.id);
      if(g) nome = (g.attivo ? (IT()?'Esci da ':'Leave ') : (IT()?'Entra in ':'Enter ')) + g.nome;
    }
    return {id:c.id, gruppo:c.gruppo, cmd:c, en:nome, it:nome, pericolo:c.rischio?1:0, p:paroleDi(c)};
  });
  return VERBI.concat(dal);
}

function interpreta(testo){
  const t = SENZA_ACCENTI(testo).trim();
  const reg = registro();
  if(!t) return {vuoto:true, lista:reg.slice(0,8), lettura:[]};
  let mod=null, best=0;
  S.modelli.forEach(m => {
    const campi=[titoloDi(m).toLowerCase(), String(m.id).toLowerCase(), String(m.runtime||'')];
    let p=0;
    t.split(/\s+/).forEach(w => { if(w.length>2) campi.forEach(c => { if(c.includes(w)) p+=w.length; }); });
    if(p>best){ best=p; mod=m; }
  });
  const punteggi = reg.map(c => {
    let p=0; c.p.forEach(w => { if(w && t.includes(w)) p += w.length+2; });
    return {c,p};
  }).sort((a,b)=>b.p-a.p);
  const top = punteggi[0].p>0 ? punteggi[0].c
    : (mod && best>2 ? reg.find(c=>c.id==='pronto') : reg.find(c=>c.id==='chiedi'));
  const conModello = ['pronto','spegni','prova'].includes(top.id) && mod && best>2;
  const lettura = [nomeCmd(top).toLowerCase()];
  if(conModello) lettura.push(titoloDi(mod).toLowerCase());

  const pr = {id:top.id, nome:nomeCmd(top), pericolo:top.pericolo, extra:{}, dati:[]};
  if(conModello){
    pr.extra={id:mod.id};
    pr.nome = {pronto:IT()?'Accendi ':'Turn on ',spegni:IT()?'Spegni ':'Turn off ',prova:IT()?'Cronometra ':'Time '}[top.id]+breve(titoloDi(mod),40);
    /* i numeri sono quelli del verdetto dell'arbitro, non una stima della pagina */
    if(top.id==='pronto') pr.dati = datiVerdetto(mod.verdetto);
  }
  if(top.id==='chiedi'){ pr.nome=nomeCmd(top)+': '+String(testo).trim(); pr.extra={testo:String(testo).trim()}; }
  const resto = punteggi.filter(x=>x.p>0 && x.c.id!==top.id).map(x=>x.c)
    .concat(reg.filter(c => c.id!==top.id && !punteggi.some(x=>x.p>0 && x.c.id===c.id)));
  return {proposta:pr, lettura, lista:resto.slice(0,6)};
}

/* ════════════════════════════════════════════════════════════════
   5. azioni. I verbi li fa la pagina; ogni altro id arriva da
   /api/comandi con la rotta scritta dentro, e si esegue quella.
   ════════════════════════════════════════════════════════════════ */
async function esegui(id, extra){
  extra = extra || {};
  apriCmdk(false);
  if(id==='hf') return vai('hf');
  if(id==='config') return vai('config');
  if(id==='chiedi') return chiedi(extra.testo||'');
  if(id==='pronto') return accendi(extra.id || (modelloSel()||{}).id);
  if(id==='spegni') return spegni(extra.id || (modelloSel()||{}).id);
  if(id==='prova') return prova(extra.id || (modelloSel()||{}).id);
  /* tutto il resto è un comando del registro, e si esegue sulla rotta che il
     registro dichiara. Indovinarla qui è il difetto del 16/08/2026. */
  const c = (S.comandi||[]).find(x=>x.id===id), corpo = (c&&c.corpo)||{};
  if(c && c.rotta==='/api/regime') return cambiaRegime(corpo.chiave);
  if(c && c.rotta==='/api/servizio') return servizio(corpo.servizio, corpo.azione||'restart');
  if(c && c.rotta==='/api/esegui'){ vai('manutenzione'); return streaming('/api/esegui',{cmd:corpo.cmd||c.id}); }
  /* fuori registro: solo gli strumenti già in elenco, che vengono dalla stessa
     configurazione. Se non c'è nemmeno lì, si dice invece di fingere. */
  if(S.strumenti.some(s=>s.id===id)){ vai('manutenzione'); return streaming('/api/esegui',{cmd:id}); }
  return log('! '+(IT()?'comando non dichiarato: ':'command not declared: ')+id);
}

/* ── accendere e spegnere un modello ──────────────────────────────────────
   Un gesto solo. Il server avvia il programma se è spento, e lo ferma se
   quello che si spegne era il suo ultimo modello: qui non si mettono in fila
   due chiamate, e non si decide cosa fare al programma. */
function commuta(id){
  const m = S.modelli.find(x=>x.id===id); if(!m) return;
  return accesoDi(m) ? spegni(id) : accendi(id);
}

/* il regime che governa il programma di questo modello, se ne esiste uno */
const regimeDi = m => S.regimi.find(g => g.runtimeAttivo===m.runtime);

async function accendi(id){
  const m = S.modelli.find(x=>x.id===id); if(!m || S.commutando[id]) return;
  /* Un esclusivo spegne gli altri programmi per farsi posto: passa dal suo
     regime, che dice PRIMA quali e chiede conferma. */
  const g = regimeDi(m);
  if(g && !g.attivo) return cambiaRegime(g.chiave);
  S.commutando[id]='on'; delete S.esito[id]; disegnaTutto();
  try{
    const r = await api('/api/modello/accendi',{method:'POST',body:JSON.stringify({modello:m.id,runtime:m.runtime})});
    S.esito[id] = {ok:true, tipo:'accendi', avviato:!!r.programmaAvviato, sec:r.loadSec||0};
  }catch(e){ S.esito[id] = {ok:false, tipo:'accendi', errore:e.message, verdetto:e.dati&&e.dati.verdetto}; }
  delete S.commutando[id];
  await aggiorna();
}

async function spegni(id){
  const m = S.modelli.find(x=>x.id===id); if(!m || S.commutando[id]) return;
  const g = regimeDi(m);
  if(g && g.attivo) return cambiaRegime(g.chiave);
  S.commutando[id]='off'; delete S.esito[id]; disegnaTutto();
  try{
    const r = await api('/api/modello/spegni',{method:'POST',body:JSON.stringify({modello:m.id,runtime:m.runtime})});
    S.esito[id] = {ok:true, tipo:'spegni', programmaSpento:!!r.programmaSpento, restano:r.restano||[]};
  }catch(e){ S.esito[id] = {ok:false, tipo:'spegni', errore:e.message, restano:(e.dati&&e.dati.restano)||[]}; }
  delete S.commutando[id];
  await aggiorna();
}

/* Cronometrare è usare il modello: se è spento prima lo si accende, col suo
   programma, per la stessa strada dell'interruttore. */
async function prova(id){
  const m = S.modelli.find(x=>x.id===id); if(!m || S.provando) return;
  const rt = S.runtime.find(r=>r.chiave===m.runtime);
  S.provando=id; disegnaInsp();
  if(!accesoDi(m) && !remotoDi(m)){
    await accendi(id);
    if(!(S.esito[id]||{}).ok){ S.provando=''; return disegnaTutto(); }
  }
  try{
    const r = await api('/api/prova',{method:'POST',body:JSON.stringify({porta:(rt?rt.porta:0),modello:m.id,runtime:m.runtime})});
    S.esito[id] = (r && !r.errore) ? {ok:true, tipo:'prova', tokS:r.tokS, ragiona:!!r.reasoning}
                                   : {ok:false, tipo:'prova', errore:(r&&r.errore)||''};
  }catch(e){ S.esito[id] = {ok:false, tipo:'prova', errore:e.message}; }
  S.provando='';
  await aggiorna();
}

/* ── i programmi, a mano ──────────────────────────────────────────────────
   Servono di rado: riavviare perché veda dei file nuovi, o spegnere un
   programma rimasto acceso senza modelli. */
async function servizio(chiave, azione){
  const k='p:'+chiave; if(S.commutando[k]) return;
  S.armato=''; S.commutando[k]=azione; delete S.esito[k]; disegnaTutto();
  scriviConsole('> '+azione+' '+chiave);
  try{
    const r = await api('/api/servizio',{method:'POST',body:JSON.stringify({servizio:chiave,azione})});
    scriviConsole((r&&r.output)||'ok');
  }catch(e){ scriviConsole('! '+e.message); S.esito[k]={ok:false,errore:e.message}; }
  delete S.commutando[k];
  await aggiorna();
}
/* Fermare a mano un programma che ha modelli dentro li spegne tutti: prima si
   mostra quali, poi si conferma. */
function spegniProgramma(chiave){
  const dentro = (processoDi(chiave)||{}).modelli||[];
  if(dentro.length && S.armato!=='stop:'+chiave){ S.armato='stop:'+chiave; return disegnaCentro(); }
  return servizio(chiave,'stop');
}

async function cambiaRegime(chiave){
  const g = S.regimi.find(x=>x.chiave===chiave); if(!g) return;
  /* Entrare ferma altri programmi: si dice PRIMA quali, e si conferma. */
  if(!g.attivo && S.armato!=='regime:'+chiave){
    S.schermo='home'; S.armato='regime:'+chiave; return disegnaTutto();
  }
  S.armato = '';
  vai('manutenzione');
  streaming('/api/regime',{chiave, azione: g.attivo?'off':'on'});
}

function fermaTutto(){
  if(S.armato==='ferma'){ S.armato=''; return esegui('ferma-tutto'); }
  S.schermo='home'; S.armato='ferma'; disegnaTutto();
}

/* Cosa vuol dire un'etichetta lo spiega Gellow, con lo stato vero davanti:
   la pagina non tiene un glossario suo. */
function spiega(k){
  const eti = T().st[k] || T().cl[k] || k;
  chiedi(IT() ? 'Cosa vuol dire «'+eti+'» per un modello in questo pannello?'
              : 'What does "'+eti+'" mean for a model in this panel?');
}

/* L'output si legge dall'alto verso il basso, come in un terminale: il comando,
   quello che ha detto, e in fondo l'esito. Al contrario, l'intestazione di una
   corsa finirebbe sotto le sue stesse righe.

   Le sequenze ANSI vanno via: gli script di manutenzione colorano per il
   terminale, e qui uscirebbero come `[92m` in mezzo alle frasi. */
const senzaAnsi = t => String(t??'').replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, '').replace(/\x1b/g, '');
const TETTO_CONSOLE = 400;
function scriviConsole(t){
  S.console.push(senzaAnsi(t));
  if(S.console.length > TETTO_CONSOLE) S.console.splice(0, S.console.length - TETTO_CONSOLE);
}
function log(t){ scriviConsole(t); disegnaCentro(); }

async function streaming(url, corpo){
  scriviConsole('> '+(corpo.cmd||corpo.chiave||''));
  disegnaCentro();
  let r;
  try{ r = await fetch(url, conToken({method:'POST',body:JSON.stringify(corpo)})); }
  catch(e){ return log('! '+e.message); }
  if(!r.ok){ return log('! '+(await r.text()||r.status)); }
  const lettore = r.body.getReader(), dec = new TextDecoder();
  let resto='';
  for(;;){
    let x; try{ x = await lettore.read(); }catch(e){ log('! '+e.message); break; }
    if(x.done) break;
    resto += dec.decode(x.value,{stream:true});
    const pezzi = resto.split('\n\n'); resto = pezzi.pop();
    for(const p of pezzi){
      const riga = p.startsWith('data: ') ? p.slice(6) : p;
      if(riga==='__FINE__'){ log('> '+(IT()?'fatto':'done')); await aggiorna(); return; }
      if(riga.startsWith('__ERRORE__')){ log('! '+riga.slice(10).trim()); await aggiorna(); return; }
      scriviConsole(riga); disegnaCentro();
    }
  }
  log('> '+(IT()?'interrotto':'interrupted'));
  aggiorna();
}

async function chiedi(testo, contesto){
  if(!testo||S.gellowOccupato) return;
  S.tab='aiuto'; S.inspAperto=true; S.gellowScroll='fondo';S.chat.push({io:1,testo}); disegnaTutto();
  S.gellowOccupato=true;S.gellowDal=Date.now();
  const attesa = {io:0,testo:'',caricando:true,controllo:!!contesto,domanda:testo,contesto:contesto||''}; S.chat.push(attesa); disegnaInsp();
  const tic=setInterval(()=>{
    const e=$('gellow-tempo');if(!e)return;
    const secondi=Math.max(1,Math.floor((Date.now()-S.gellowDal)/1000));
    e.textContent=secondi+(IT()?(secondi===1?' secondo':' secondi'):(secondi===1?' second':' seconds'));
  },1000);
  try{
    const r = await api('/api/spiega',{method:'POST',body:JSON.stringify({domanda:testo,contesto:contesto||'',lingua:LINGUA})});
    attesa.testo = (r&&r.ok) ? r.risposta : (IT()?'Gellow non risponde':'Gellow is not answering');
    attesa.programmi=!!r.nonDisponibile;
  }catch(e){ attesa.testo = String(e.message); }
  clearInterval(tic);attesa.caricando=false;attesa.nuova=true;S.gellowOccupato=false;S.gellowDal=0;S.gellowScroll='risposta';
  disegnaInsp();
}

/* ════════════════════════════════════════════════════════════════
   6. tema. In automatico lo chiede al Mac: in modalità app il
   browser riporta "light" anche col sistema in scuro.
   ════════════════════════════════════════════════════════════════ */
async function applicaTema(){
  let eff = S.tema;
  if(eff==='auto'){
    try{ const r = await api('/api/tema'); eff = r && r.scuro ? 'dark' : 'light'; }
    catch(e){ eff = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  } else eff = (eff==='scuro') ? 'dark' : 'light';
  document.documentElement.dataset.theme = eff;
}

/* ════════════════════════════════════════════════════════════════
   7. caricamento dati. Una tornata sola, e si fermano da soli
   quando la finestra non si vede: un pannello aperto e fermo
   non deve tenere sveglia la macchina.
   ════════════════════════════════════════════════════════════════ */
let TIMER=null;
function staModificando(){
  const a=document.activeElement;
  return !!a && ['INPUT','SELECT','TEXTAREA','SUMMARY'].includes(a.tagName);
}
async function aggiorna(){
  try{
    /* /api/modelli porta in una richiesta i numeri della macchina, lo stato,
       la classe e il verdetto di ogni modello: sono già calcolati dove stanno
       le misure, e la pagina non li rifà. */
    const [mem, mod, runtime] = await Promise.all([
      api('/api/memoria'), api('/api/modelli'), api('/api/runtime')
    ]);
    S.offline=false;
    S.mem = mem || null;
    S.mod = mod || null;
    S.modelli = (mod && Array.isArray(mod.modelli)) ? mod.modelli : [];
    /* Un preferito appena cambiato vince su una risposta partita prima del
       clic: senza, la stella tornava indietro per un giro e il clic sembrava
       perso. Appena il server dice la stessa cosa, la scelta locale si scorda. */
    S.modelli.forEach(m=>{ if(m.id in S.prefLocali){
      if(!!m.preferito===S.prefLocali[m.id]) delete S.prefLocali[m.id]; else m.preferito=S.prefLocali[m.id]; } });
    S.runtime = Array.isArray(runtime)?runtime:[];
    if(!S.sel && S.modelli.length) S.sel = prontoId() || S.modelli[0].id;
  }catch(e){ S.offline=true; }
  /* Il polling non deve sostituire un menu mentre è aperto né un campo mentre
     qualcuno scrive. I dati vengono aggiornati comunque; il prossimo giro,
     appena il controllo perde il fuoco, ridisegna anche la pagina. */
  try{ S.autonomia=await api('/api/autonomia'); }catch(e){ S.autonomia={available:true,lastError:e.message}; }
  if(!staModificando())disegnaTutto();
}
/* le liste che cambiano solo quando si cambia configurazione: una volta sola.
   Alcune rotte rispondono `null` quando non c'è niente, non `[]`: il `|| def`
   non è pignoleria, è la differenza fra una lista vuota e la pagina che cade. */
async function caricaLento(){
  const uno = async (p, dove, def) => { try{ const v = await api(p); S[dove] = v || def; }catch(e){ S[dove] = def; } };
  const mappa = async (p, dove) => { try{ (await api(p) || []).forEach(x => S[dove][x.chiave||x.provider] = x); }catch(e){} };
  const configurazioni = async () => { try{ const v=await api('/api/config'); S.configErrori=(v&&v.errori)||[]; }catch(e){ S.configErrori=[e.message]; } };
  await Promise.all([
    uno('/api/regimi','regimi',[]),
    uno('/api/strumenti','strumenti',[]),
    uno('/api/comandi','comandi',[]),
    uno('/api/modelli/archivio','archivio',[]),
    uno('/api/documenti','documenti',[]),
    uno('/api/hf/stato','scarichi',[]),
    uno('/api/domande','domande',[]),
    uno('/api/aiuto','aiuto',null),
    configurazioni(),
    mappa('/api/capacita','capacita'),
    mappa('/api/provider','provider'),
    mappa('/api/credenziali','cred')
  ]);
  if(!staModificando())disegnaTutto();
}
function avviaPolling(){
  clearInterval(TIMER);
  TIMER = setInterval(()=>{ if(!document.hidden) aggiorna(); }, 5000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) aggiorna(); });

/* ════════════════════════════════════════════════════════════════
   8. disegno. innerHTML, niente framework.

   La regola della pagina: dati strutturati, quindi tabelle, grafici e
   schemi. Niente paragrafi scritti dal codice — il testo libero lo
   scrive solo Gellow, quando glielo si chiede.
   ════════════════════════════════════════════════════════════════ */
const pillStato = s => ({pronto:'p-ok','in-memoria':'p-acc',spento:'p-neutro','in-arrivo':'p-acc',guasto:'p-bad',remoto:'p-acc'}[s]||'p-neutro');
const ICO = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/>',
  client:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/>',
  controlli:'<line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/><circle cx="9" cy="8" r="2.4"/><circle cx="16" cy="16" r="2.4"/>',
  hf:'<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
  archivio:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9"/><line x1="10" y1="13" x2="14" y2="13"/>',
  file:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8.5" y1="8" x2="15.5" y2="8"/><line x1="8.5" y1="12" x2="15.5" y2="12"/><line x1="8.5" y1="16" x2="13" y2="16"/>',
  accendi:'<path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>',
  riavvia:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/>'
};
const ico = k => '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+ICO[k]+'</svg>';
/* Le sezioni: tre che si usano sempre, tre che servono ogni tanto. Le chiavi
   sono quelle di sempre, così i collegamenti interni (vai('hf'),
   vai('config')…) restano validi. */
const SCHERMI = [['home','home','Panoramica','Overview'],['configurazioni','client','Client','Clients'],
  ['manutenzione','controlli','Controlli','Checks'],['hf','hf','Scarica modelli','Download models'],
  ['archivio','archivio','Archivio','Archive'],['config','file','File','Files']];

/* Una sezione che non esiste porta alla Panoramica: la voce di menu di una
   versione più vecchia dell'app non deve lasciare la pagina senza niente di
   selezionato. */
function vai(s, filtro){
  S.schermo = SCHERMI.some(x=>x[0]===s) ? s : 'home';
  if(filtro){ S.filtro=filtro; localStorage.setItem('filtro-modelli',filtro); } S.armato=''; S.inspAperto=false; disegnaTutto();

function vaiTab(t){ if(t==='aiuto'&&S.tab!=='aiuto')S.gellowScroll='fondo';S.tab=t; S.inspAperto=true; disegnaTutto(); }
function chiudiInsp(){ S.inspAperto=false; disegnaTutto(); }
/* disegnaCentro serve: la riga evidenziata sta nella tabella, non
   nell'ispettore. Senza, il segno della selezione arrivava col giro di
   aggiornamento dopo, e il clic sembrava non aver fatto niente. */
function scegli(id){
  S.sel=id; S.tab='modello'; S.inspAperto=true;
  S.armato=''; S.erroreArchivio=''; S.esameArchivio=null; disegnaTutto();
}

function disegnaTutto(){
  /* L'ispettore c'è solo quando è aperto, su qualunque scheda: Gellow si apre
     da dovunque, e una scheda senza modello selezionato non tiene occupata una
     colonna vuota. */
  document.querySelector('main').classList.toggle('insp-aperto',!!S.inspAperto);
  disegnaTestata(); disegnaLato(); disegnaCentro(); disegnaInsp(); disegnaPiede();
}

/* Gellow è acceso quando il programma che serve il suo modello risponde. */
function gellowAcceso(){
  const a=S.aiuto||{}, rt=S.runtime.find(r=>r.chiave===a.runtime);
  return !!(a.modello && rt && rt.attivo);
}

function disegnaTestata(){

}

function disegnaLato(){
  const v = ([k,i,it,en]) => voce(S.schermo===k, i, IT()?it:en,

    +'<div class="gruppo k">'+esc(IT()?'Altro':'More')+'</div>'+SCHERMI.slice(3).map(v).join('');
}
function voce(on, icona, nome, n, onclick){

    +'<span class="nome">'+esc(nome)+'</span>'+(n||n===0?'<span class="n">'+n+'</span>':'')+'</button>';

/* bottone: un pulsante che sa anche di non poter fare niente.

   Il motivo per cui è spento non è un dettaglio estetico: un pulsante grigio
   senza spiegazione è indistinguibile da uno rotto, ed è esattamente il
   sospetto che il 18/08/2026 si è rivelato fondato su metà pannello. Se
   `perche` è pieno il pulsante è disabilitato E dice perché, sempre insieme:
   separare le due cose è come si torna al punto di partenza.

   `grezzo` per le etichette che contengono già markup (la rotellina). */
function bottone(classe, azione, etichetta, perche, grezzo){
  const off = !!perche;
  return '<button class="'+classe+'" onclick="'+azione+'"'
    + (off ? ' disabled title="'+esc(perche)+'"' : '')
    + '>' + (grezzo ? etichetta : esc(etichetta)) + '</button>';
}
/* un pulsante a sola icona: l'etichetta c'è sempre, come titolo e per chi non
   vede; se è spento, il titolo dice anche perché. */
function iconaBtn(azione, quale, etichetta, perche){
  return '<button class="ib" onclick="'+azione+'" aria-label="'+esc(etichetta)+'"'
    +(perche ? ' disabled title="'+esc(etichetta+': '+perche)+'"' : ' title="'+esc(etichetta)+'"')+'>'+ico(quale)+'</button>';
}
function scelteBottoni(titolo,valore,voci,azione){
  return '<div class="scelta-riga"><span class="et">'+esc(titolo)+'</span><span class="scelte">'
    +voci.map(([v,n])=>'<button class="'+(v===valore?'on':'')+'" onclick="'+azione+'('+arg(v)+')">'+esc(n)+'</button>').join('')
    +'</span></div>';
}
const metrica = (k,v,cl) => '<span class="'+(cl||'')+'" style="white-space:nowrap"><span class="k">'+esc(k)+'</span> <b class="mono" style="font-weight:400;font-size:12px;color:var(--strong)">'+esc(v)+'</b></span>';
const nota = (c,t,b) => '<div class="nota '+c+'"><div>'+(t?'<b>'+esc(t)+'</b>':'')+'<span>'+esc(b)+'</span></div></div>';
const chips = (voci,classe) => voci.length ? '<div class="chips">'+voci.map(x=>'<span class="chip'+(classe?' '+classe:'')+'">'+esc(x)+'</span>').join('')+'</div>' : '';

function disegnaCentro(){
  if(S.offline){
    $('centro').innerHTML = '<div class="vuoto"><b>'+esc(T().offline)+'</b></div>';
    return;
  }
  const f = {home:vistaHome, configurazioni:vistaConfigurazioni, manutenzione:vistaManutenzione,
             hf:vistaHF, config:vistaConfig, archivio:vistaArchivio}[S.schermo] || vistaHome;
  $('centro').innerHTML = '<div class="pagina">'+f()+'</div>';
  /* Cambiando schermata si torna in cima. Solo cambiando: questa funzione gira
     anche ogni cinque secondi col polling, e riportare su la pagina mentre
     qualcuno legge sarebbe peggio del problema che risolve. */
  const dove = S.schermo+'|'+S.filtro;
  if(dove !== ultimoDisegno){ ultimoDisegno = dove; $('centro').scrollTop = 0; }
  /* l'output cresce in fondo, e in fondo deve restare l'occhio. Non
     scrollIntoView: sposterebbe anche la pagina intorno. */
  const u = $('uscita'); if(u) u.scrollTop = u.scrollHeight;
}
let ultimoDisegno = '';

/* ── Stack: la macchina in una schermata ──────────────────────────────────
   Quattro numeri, la memoria disegnata, e sotto lo schema programmi → modelli.
   Ogni modello ha il suo interruttore; il programma lo segue da solo. */
function vistaHome(){
  return kpi()+graficoMemoria()+avvisi()+conferme()+vistaModelli();
}

function kpi(){
  const inRAM = S.modelli.filter(m=>accesoDi(m)&&!remotoDi(m)).length;
  /* i programmi sono le sezioni della tabella: chi sta sotto un altro (stesso
     motore, altra porta) non è un programma in più, ma lo tiene acceso */
  const sezioni = S.runtime.filter(r=>sezioneDi(r.chiave)===r.chiave);
  const accese = sezioni.filter(r=>S.runtime.some(x=>sezioneDi(x.chiave)===r.chiave && x.attivo)).length;
  const t = (et,v,sub) => '<div><span class="et">'+esc(et)+'</span><span class="v">'+esc(v)+(sub?' <small>'+esc(sub)+'</small>':'')+'</span></div>';
  return '<div class="kpi">'
    +t(IT()?'RAM usata dai modelli':'RAM used by models', gb(occupatiGB())+' GB', '/ '+Math.round(totaleGB())+' GB')
    +t(IT()?'Libera per un modello':'Free for a model', gb(disponibiliGB())+' GB')
    +t(IT()?'Programmi accesi':'Programs running', accese+' / '+sezioni.length)
    +t(IT()?'Modelli in RAM':'Models in RAM', String(inRAM))+'</div>';
}

/* Il colore di un programma: la sua posizione nella configurazione, che non
   cambia accendendo o spegnendo gli altri. Oltre l'ottavo non si inventano
   tinte nuove: restano tutti nel grigio «altro». */
function coloreProgramma(chiave){
  const i = S.runtime.findIndex(r=>r.chiave===chiave);
  return (i>=0 && i<8) ? 'var(--serie-'+(i+1)+')' : 'var(--serie-altro)';
}
const tip = (valore, etichetta) => ' data-tip-v="'+esc(valore)+'"'+(etichetta?' data-tip-l="'+esc(etichetta)+'"':'');

/* La memoria: una barra impilata, un segmento per programma. I numeri sono
   quelli misurati sui processi (memory.go), gli stessi della barra dei menu.
   Ogni valore del grafico è anche nella legenda e nella tabella sotto: il
   passaggio del mouse aggiunge, non nasconde. */
function graficoMemoria(){
  const tot = totaleGB(); if(!tot) return '';
  const proc = ((S.mem&&S.mem.processi)||[]).filter(p=>(p.correnteByte||0)/1e9>0.05);
  const lib = liberiGB(), ris = Math.min(riservaGB(), lib), tet = tettoGB();
  /* Di ciò che i modelli non occupano, libero davvero è quanto l'arbitro
     concede (tiene conto della memoria che si può impegnare adesso). Il resto
     lo tengono le altre applicazioni del Mac: disegnarlo come «libero» è la
     promessa che il 3/10/2026 è finita in kernel panic. */
  const veri = Math.min(disponibiliGB(), Math.max(0, lib-ris)), altro = Math.max(0, lib-ris-veri);
  /* il tetto è di un programma (oggi oMLX) e vale solo per i suoi modelli: lo si dice */
  const nomeTetto = M().tettoDi ? T().ceilingOf+' '+M().tettoDi : T().ceilingShort;
  const pct = g => (g/tot*100).toFixed(2)+'%';
  const dentro = p => (p.modelli||[]).map(x=>cortoDi({id:x})).join(', ');
  let h = '<figure class="mem"><div class="mem-barra" role="img" aria-label="'
    +esc((IT()?'Memoria: ':'Memory: ')+gb(occupatiGB())+' / '+gb(tot)+' GB')+'">'
    +(tet?'<span class="mem-tetto" style="left:'+pct(tet)+'"'+tip(tet+' GB',nomeTetto+' · '+T().ceilingWhy)+'></span>':'');
  proc.forEach(p => {
    const g = p.correnteByte/1e9;
    h += '<span class="mem-seg" tabindex="0" style="width:'+pct(g)+';background:'+coloreProgramma(p.chiave)+'"'
      +tip(gb(g)+' GB'+(p.stimato?' ~':''), (p.nome||p.chiave)+(dentro(p)?' · '+dentro(p):''))+'></span>';
  });
  h += (altro>0.5?'<span class="mem-seg mem-altro" tabindex="0" style="width:'+pct(altro)+'"'+tip(gb(altro)+' GB', T().otherApps+' · '+T().otherAppsWhy)+'></span>':'')
    +'<span class="mem-libero"'+tip(gb(veri)+' GB', T().free)+'></span>'
    +(ris>0?'<span class="mem-riserva" style="width:'+pct(ris)+'"'+tip(gb(ris)+' GB', T().reserved)+'></span>':'')
    +'</div><div class="mem-asse">'+[0,tot/4,tot/2,tot*3/4,tot].map((v,i)=>'<span>'+Math.round(v)+(i===4?' GB':'')+'</span>').join('')+'</div>'
    +'<div class="legenda">'
    +proc.map(p=>'<span><i style="background:'+coloreProgramma(p.chiave)+'"></i>'+esc(p.nome||p.chiave)
      +' <b>'+gb(p.correnteByte/1e9)+' GB</b></span>').join('')
    +(altro>0.5?'<span'+tip(gb(altro)+' GB', T().otherAppsWhy)+'><i class="mem-altro"></i>'+esc(T().otherApps)+' <b>'+gb(altro)+' GB</b></span>':'')
    +'<span><i style="background:var(--inset);border:1px solid var(--line2)"></i>'+esc(T().free)+' <b>'+gb(veri)+' GB</b></span>'
    +(ris>0?'<span><i class="mem-riserva"></i>'+esc(T().reserved)+' <b>'+gb(ris)+' GB</b></span>':'')
    +(tet?'<span'+tip(tet+' GB',T().ceilingWhy)+'><i style="width:2px;background:var(--strong)"></i>'+esc(nomeTetto)+' <b>'+tet+' GB</b></span>':'')
    +'</div></figure>';
  return h;
}

/* Gli avvisi arrivano dal server già scritti: qui stanno su una riga, e chi
   vuole capirli li passa a Gellow. */
function avvisi(){
  const righe = [];
  ((S.mem&&S.mem.avvisi)||[]).forEach(a => righe.push(['',a]));
  if(S.mem && S.mem.etaSecondi>30) righe.push(['', T().stale+' '+S.mem.etaSecondi+' s']);
  (S.configErrori||[]).forEach(e => righe.push(['grave',e]));
  if(!righe.length) return '';
  const domanda = IT()?'Spiegami questo avviso e cosa devo fare.':'Explain this warning and what I should do.';
  return '<div class="avvisi">'+righe.map(([c,t]) => '<div class="avviso '+c+'"><span>'+esc(t)+'</span>'
    +'<button class="b3 sm" onclick="chiedi('+arg(domanda)+','+arg(t)+')">'+esc(IT()?'Chiedi a Gellow':'Ask Gellow')+'</button></div>').join('')+'</div>';
}

/* Le conferme: cosa si spegne, a etichette, e due pulsanti. */
function conferme(){
  const a = S.armato||'';
  let titolo='', voci=[], azione='';
  if(a==='ferma'){ titolo=T().stopAll; voci=S.runtime.filter(r=>r.attivo).map(r=>r.nome||r.chiave); azione='fermaTutto()'; }
  else if(a.startsWith('regime:')){
    const g = S.regimi.find(x=>'regime:'+x.chiave===a); if(!g) return '';
    titolo=g.nome; voci=g.fermera||[]; azione='cambiaRegime('+arg(g.chiave)+')';
  }
  else if(a.startsWith('stop:')){
    const k=a.slice(5); titolo=(IT()?'Spegni ':'Stop ')+nomeRuntime(k);
    voci=((processoDi(k)||{}).modelli||[]).map(x=>cortoDi({id:x})); azione='servizio('+arg(k)+',\'stop\')';
  }
  else return '';
  return '<div class="conferma"><b>'+esc(titolo)+'</b>'
    +(voci.length?'<span class="k">'+esc(IT()?'spegne':'stops')+'</span>'+voci.map(v=>'<span class="chip">'+esc(v)+'</span>').join(''):'')
    +'<span class="sp"></span><button class="bx sm" onclick="'+azione+'">'+esc(T().confirm)+'</button>'
    +'<button class="b3 sm" onclick="S.armato=\'\';disegnaCentro()">'+esc(IT()?'Annulla':'Cancel')+'</button></div>';
}

/* ── i modelli: lo schema programmi → modelli ─────────────────────────── */
/* automatico: un modello che lavora dietro le quinte (OCR, ricerca nei
   documenti, Gellow), non uno che si sceglie per chattare o programmare. */
function automatico(m){
  if(['chat','coding'].includes(m.uso)) return false;   /* dichiarato nel catalogo: vince sul nome */
  if(['supporto','embedding','documenti','conversione','sperimentale','alternativo'].includes(m.uso)) return true;
  if(S.aiuto && String(S.aiuto.modello)===String(m.id)) return true;
  const testo = (m.id+' '+(m.nome||'')).toLowerCase();
  return (m.indizi||[]).some(x=>['ricerca-testi','diffusione','trascrive'].includes(x.tratto)) ||
    /(ocr|embed|rerank|markitdown|diffusion|transcri)/.test(testo);
}
function usoDi(m){
  const dichiarato = {chat:'Chat',coding:IT()?'Programmazione':'Coding',supporto:'Gellow',embedding:IT()?'Ricerca documenti':'Document search',
    documenti:IT()?'Lettura documenti':'Document reading',conversione:IT()?'Conversione':'Conversion',
    sperimentale:IT()?'Sperimentale':'Experimental',alternativo:IT()?'Alternativo':'Alternative'};
  if(dichiarato[m.uso]) return dichiarato[m.uso];
  if(S.aiuto && String(S.aiuto.modello)===String(m.id)) return 'Gellow';
  const tratti = new Set((m.indizi||[]).map(x=>x.tratto));
  const testo = (m.id+' '+(m.nome||'')+' '+(m.runtime||'')).toLowerCase();
  if(tratti.has('ricerca-testi')) return IT()?'Ricerca documenti':'Document search';
  if(tratti.has('diffusione')) return IT()?'Sperimentale':'Experimental';
  if(tratti.has('trascrive')) return IT()?'Trascrizione':'Transcription';
  if(tratti.has('vede-immagini')) return IT()?'Testo e immagini':'Text and images';
  if(tratti.has('programmazione') || /(code|coder|agentic|mtplx|ds4|deepseek)/.test(testo)) return IT()?'Programmazione':'Coding';
  return 'Chat';
}
function ordinaModelli(lista){
  return lista.slice().sort((a,b)=>{
    const primaGliAttivi = Number(accesoDi(b))-Number(accesoDi(a));
    if(primaGliAttivi) return primaGliAttivi;
    let d = 0;
    if(S.ordineModelli==='grandi') d = (b.gb||0)-(a.gb||0);
    else if(S.ordineModelli==='veloci') d = (b.tokS||0)-(a.tokS||0);
    if(!d) d = nomeReale(a).localeCompare(nomeReale(b),LINGUA,{numeric:true,sensitivity:'base'});
    return d;
  });
}
