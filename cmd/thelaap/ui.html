/* Perché un interruttore non si può premere: la chiave arriva dal server
   (lifecycle.go), qui c'è solo come si legge. */
function bloccoTesto(blocco, programma){
  return ({
    'remoto': IT()?'Gira sul server del provider.':'Runs on the provider server.',
    'in-arrivo': IT()?'Download in corso.':'Still downloading.',
    'guasto': IT()?programma+' non conosce questo id.':programma+' does not know this id.',
    'senza-avvio': IT()?programma+' è spento e manca il comando per avviarlo.':programma+' is off and has no start command.',
    'senza-arresto': IT()?'Manca il comando per fermare '+programma+'.':'No command to stop '+programma+'.',
    'altri-modelli': IT()?programma+' tiene altri modelli e non sa scaricarne uno solo.':programma+' holds other models and cannot unload just one.'
  })[blocco] || (IT()?'Non disponibile.':'Not available.');
}
function interruttore(m){
  const acceso = accesoDi(m), i = m.interruttore||{}, prog = nomeRuntime(m.runtime), inCorso = S.commutando[m.id];
  const perche = inCorso ? (IT()?'Operazione in corso.':'In progress.') : i.puo ? '' : bloccoTesto(i.blocco, prog);
  const effetto = acceso ? (IT()?'Spegni':'Turn off')+(i.fermaProgramma?' · '+(IT()?'spegne anche ':'also stops ')+prog:'')
                         : (IT()?'Accendi':'Turn on')+(i.avviaProgramma?' · '+(IT()?'avvia anche ':'also starts ')+prog:'');
  return '<button class="sw'+(acceso?' on':'')+(inCorso?' busy':'')+'" role="switch" aria-checked="'+acceso+'" aria-label="'+esc(effetto)+'"'
    +' onclick="event.stopPropagation();commuta('+arg(m.id)+')"'
    +(perche ? ' disabled title="'+esc(perche)+'"' : ' title="'+esc(effetto)+'"')+'><i></i></button>';
}

/* Un programma può dichiarare di stare sotto un altro (`gruppo`): è lo stesso
   motore che gira una seconda volta su un'altra porta. Non ha una sezione sua,
   i suoi modelli si vedono in quella del programma che lo ospita. */
function sezioneDi(chiave){
  const r = S.runtime.find(x=>x.chiave===chiave);
  return (r && r.gruppo && S.runtime.some(x=>x.chiave===r.gruppo)) ? r.gruppo : chiave;
}
function rigaGruppo(g){
  const rt = g.rt, k = g.chiave;
  if(!rt){
    const remoto = g.modelli.some(remotoDi);
    return '<div class="tab-gruppo"><i class="quadro" style="background:var(--serie-altro)"></i><span class="nome">'
      +esc((S.provider[k]||{}).nome||k)+'</span><span class="pill '+(remoto?'p-acc':'p-bad')+'">'
      +esc(remoto?T().st.remoto:(IT()?'non dichiarato':'not declared'))+'</span></div>';
  }
  const p = processoDi(k), ram = p ? (p.correnteByte||0)/1e9 : 0, inCorso = S.commutando['p:'+k], err = S.esito['p:'+k];
  const occupato = inCorso ? (IT()?'Operazione in corso.':'In progress.') : '';
  /* la sezione è accesa se lo è uno qualunque dei programmi che ospita */
  const ospiti = S.runtime.filter(x=>x.chiave!==k && sezioneDi(x.chiave)===k), acceso = rt.attivo || ospiti.some(x=>x.attivo);
  return '<div class="tab-gruppo"><i class="quadro" style="background:'+coloreProgramma(k)+'"></i>'
    +'<span class="nome"'+tip(rt.nome||k, rt.cosa||'')+'>'+esc(rt.nome||k)+'</span>'
    +'<span class="pill '+(acceso?'p-ok':'p-neutro')+'">'+(inCorso?'<span class="carica"></span>':esc(acceso?T().on:T().off))+'</span>'
    +'<span class="q">:'+[rt].concat(ospiti).filter(x=>x.attivo||x===rt).map(x=>x.porta).join(' · :')+'</span>'
    +(ram>0.05?'<span class="q">'+gb(ram)+' GB'+(p.stimato?' ~':'')+'</span>':'')
    +(err?'<span class="q" style="color:var(--bad-ink)" title="'+esc(err.errore)+'">'+esc(breve(err.errore,80))+'</span>':'')
    +'<span class="sp"></span>'
    +(rt.attivo ? iconaBtn('servizio('+arg(k)+',\'restart\')', 'riavvia', T().restart+' '+(rt.nome||k),
        occupato || (rt.puoRiavviare?'':(IT()?'manca il comando in configurazione':'no command in the config'))) : '')
    +iconaBtn(rt.attivo?'spegniProgramma('+arg(k)+')':'servizio('+arg(k)+',\'start\')', 'accendi',
        (rt.attivo?T().turnOff:T().turnOn)+' '+(rt.nome||k),
        occupato || ((rt.attivo?rt.puoFermare:rt.puoAvviare)?'':(IT()?'manca il comando in configurazione':'no command in the config')))
    +'</div>';
}

      +(es&&!es.ok?'<span class="pill p-bad">!</span>':'')+'</span>'

function vistaModelli(){
  const filtri = {recenti:[IT()?'Recenti':'Recent', m=>recente(m)],
    preferiti:[T().favorites, m=>!!m.preferito],
    tutti:[IT()?'Tutti':'All', ()=>true],
    principali:[IT()?'Chat e codice':'Chat and code', m=>!automatico(m)&&!remotoDi(m)],
    automatici:[IT()?'Strumenti':'Tools', m=>automatico(m)],
    immagini:[IT()?'Immagini':'Images', m=>accetta(m,'image')],
    remoto:[IT()?'Remoti':'Remote', m=>remotoDi(m)]};
  if(!S.modelli.some(filtri.immagini[1])) delete filtri.immagini;   /* nessuno le accetta: niente voce */
  if(!filtri[S.filtro]) S.filtro='tutti';
  /* niente di recente (o dati non ancora arrivati): si vede tutto, senza toccare la scelta di chi usa il pannello */
  const vista = (S.filtro==='recenti' && !S.modelli.some(recente)) ? 'tutti' : S.filtro;
  const visibili = S.modelli.filter(filtri[vista][1]);
  const haCmd = id => (S.comandi||[]).some(c=>c.id===id);
  let h = '<div class="strumenti"><div class="seg">'+Object.keys(filtri).map(k=>'<button class="'+(vista===k?'on':'')+'" onclick="vai(\'home\',\''+k+'\')">'
      +esc(filtri[k][0])+' <span class="n">'+S.modelli.filter(filtri[k][1]).length+'</span></button>').join('')+'</div><div class="strumenti-azioni">'
    +(S.cambiato?'<span class="pill p-warn">'+esc(T().unsaved)+'</span><button class="b1 sm" onclick="salva()">'+esc(T().saveChanges)+'</button>':'')
    +(haCmd('riaccendi-tutto')?'<button class="b3 sm" onclick="esegui(\'riaccendi-tutto\')">'+esc(T().startAll)+'</button>':'')
    +(haCmd('ferma-tutto')?bottone('bxq sm','fermaTutto()',T().stopAll,
        S.runtime.some(r=>r.attivo)?'':(IT()?'È già tutto spento.':'Everything is already off.')):'')
    +'</div></div>';
  if(!S.modelli.length) return h+'<div class="tab"><div class="vuoto"><b>'+esc(T().noModels)+'</b>'
    +'<button class="b2" onclick="vai(\'hf\')">'+esc(T().addHF)+'</button></div></div>';

  /* un gruppo per programma, nell'ordine della configurazione; in cima chi ha
     qualcosa di acceso, in fondo ciò che gira altrove */
  const gruppi = S.runtime.map(rt=>({chiave:rt.chiave, rt, modelli:[]})).filter(g=>sezioneDi(g.chiave)===g.chiave);
  visibili.forEach(m => {
    const k = sezioneDi(m.runtime);
    let g = gruppi.find(x=>x.chiave===k);
    if(!g){ g={chiave:k, rt:null, modelli:[]}; gruppi.push(g); }
    g.modelli.push(m);
  });
  const rango = g => g.modelli.some(accesoDi) ? 0 : (g.rt&&g.rt.attivo) ? 1 : g.rt ? 2 : 3;
  const mostra = gruppi.filter(g=>g.modelli.length || (vista==='tutti' && g.rt && g.rt.attivo))
    .map((g,i)=>[g,i]).sort((a,b)=>rango(a[0])-rango(b[0])||a[1]-b[1]).map(x=>x[0]);
  const col = (k,et,cl) => '<button class="'+[cl||'',S.ordineModelli===k?'on':''].join(' ').trim()+'" onclick="impostaOrdineModelli(\''+k+'\')">'
    +esc(et)+(S.ordineModelli===k?' ↓':'')+'</button>';
  h += '<div class="tab"><div class="tab-testa"><span></span>'+col('attivi',T().colModel)
    +'<span class="k c-uso">'+esc(IT()?'Uso':'Use')+'</span><span class="k c-ctx">'+esc(T().colContext)+'</span>'+col('grandi',T().colWeight)+col('veloci','tok/s','c-tok')
    +'<span class="k c-cl">Client</span></div>'
    +mostra.map(g=>rigaGruppo(g)+ordinaModelli(g.modelli).map(rigaModello).join('')).join('')
    +(mostra.length?'':'<div class="vuoto"><b>'+esc(vista==='preferiti'?T().noFavorites:T().noneHere)+'</b>'
      +(vista==='preferiti'?esc(T().noFavoritesHow):'')+'</div>')+'</div>';
  return h;
}

/* ── un solo tooltip per tutta la pagina ──────────────────────────────────
   Prima il valore, poi a cosa si riferisce. Il testo entra con textContent:
   i nomi dei modelli arrivano da servizi di terzi. Vale anche col fuoco da
   tastiera, non solo col mouse. */
function mostraTip(e){
  const el = e.target.closest ? e.target.closest('[data-tip-v]') : null, t = $('tip');
  if(!el){ t.style.display='none'; return; }
  t.textContent='';
  const b = document.createElement('b'); b.textContent = el.dataset.tipV; t.appendChild(b);
  if(el.dataset.tipL) t.appendChild(document.createTextNode(el.dataset.tipL));
  t.style.display='block';
  const r = el.getBoundingClientRect(), x = e.clientX || (r.left+r.width/2);
  t.style.left = Math.max(8, Math.min(innerWidth-t.offsetWidth-8, x-t.offsetWidth/2))+'px';
  t.style.top = (r.top-t.offsetHeight-8 < 8 ? r.bottom+8 : r.top-t.offsetHeight-8)+'px';
}
document.addEventListener('pointermove', mostraTip);
document.addEventListener('focusin', mostraTip);
document.addEventListener('focusout', () => { $('tip').style.display='none'; });

  const m=S.modelli.find(x=>x.runtime===runtime&&x.id===id); if(!m)return;
  if(quale==='pi')m.inPi=valore; else if(quale==='oc')m.inOC=valore; else m.inDSH=valore;
  S.cambiato=true; disegnaCentro();
}
function ordinaConfigurazioni(lista){
  return lista.slice().sort((a,b)=>{
    let d=0;
    if(S.ordineConfigurazioni==='configurati')d=(Number(!!b.inPi)+Number(!!b.inOC)+Number(!!b.inDSH))-(Number(!!a.inPi)+Number(!!a.inOC)+Number(!!a.inDSH));
    else if(S.ordineConfigurazioni==='pi')d=Number(!!b.inPi)-Number(!!a.inPi);
    else if(S.ordineConfigurazioni==='opencode')d=Number(!!b.inOC)-Number(!!a.inOC);
    else if(S.ordineConfigurazioni==='dsh')d=Number(!!b.inDSH)-Number(!!a.inDSH);
    else if(S.ordineConfigurazioni==='programma')d=nomeRuntime(a.runtime).localeCompare(nomeRuntime(b.runtime),LINGUA,{sensitivity:'base'});
    if(!d)d=nomeReale(a).localeCompare(nomeReale(b),LINGUA,{numeric:true,sensitivity:'base'});
    return d;
  });
}

function testoRisultato(){ return (S.console||[]).join('\n').trim(); }
async function copiaRisultato(){
  const testo=testoRisultato(); if(!testo)return;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(testo);
    else throw new Error('clipboard');
  }catch(e){
    const t=document.createElement('textarea'); t.value=testo; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  S.copiato=true; disegnaCentro(); setTimeout(()=>{S.copiato=false;if(S.schermo==='manutenzione')disegnaCentro();},1800);
}

              :'Explain this check: if everything is fine, say so clearly. If there are problems, group them by cause and give me the buttons or commands to fix them. Distinguish expected shutdowns from failures.',testo);
}

/* Il guardiano dello stack: stato, verifiche e registro come tabelle. L'unico

  if(!a||!a.available)return '';
  const enabled=!!(a.settings&&a.settings.enabled), last=a.last||{}, events=a.events||[];
  const paused=a.maintenance||(a.mode&&(a.mode.mode!=='normal'||a.mode.phase!=='ready'));
  const stato = paused ? [IT()?'in pausa':'paused','p-neutro'] : a.running ? [IT()?'controllo in corso':'checking','p-acc']
    : enabled ? [IT()?'riparazione automatica':'auto repair','p-ok'] : [IT()?'solo osservazione':'observe only','p-neutro'];
  let h='<div class="tab" id="autonomia"><div class="tab-gruppo"><span class="nome">'+esc(IT()?'Guardiano dello stack':'Stack guardian')+'</span>'
    +'<span class="pill '+stato[1]+'">'+esc(stato[0])+'</span>'
    +(a.mode&&a.mode.mode?'<span class="q">'+esc(a.mode.mode)+'</span>':'')
    +'<span class="q">'+esc(quando(last.at))+'</span><span class="sp"></span>'
    +'<button class="b3 sm" onclick="autonomiaAzione('+arg(enabled?'disable':'enable')+')">'
      +esc(enabled?(IT()?'Solo osserva':'Observe only'):(IT()?'Ripara da solo':'Auto repair'))+'</button>'
    +bottone('b2 sm',"autonomiaAzione('check')",IT()?'Controlla e ripara':'Check and repair',
      a.running?(IT()?'Un controllo è già in corso.':'A check is already running.'):'')+'</div>';
  const righe=[];
  for(const f of last.findings||[]) righe.push('<tr><td><b>'+esc(f.service||'')+'</b></td><td>'+esc(f.blocked||f.problem||'')
    +'</td><td class="az"><span class="pill p-warn">'+esc(IT()?'da sistemare':'to fix')+'</span></td></tr>');

function numeroHF(v){ return (Number(v)||0).toLocaleString(IT()?'it-IT':'en-US'); }
function dataHF(v){
  if(!v)return IT()?'data ignota':'unknown date';
  const d=new Date(v); if(Number.isNaN(d.getTime()))return String(v).slice(0,10);
  return new Intl.DateTimeFormat(IT()?'it-IT':'en-US',{day:'numeric',month:'short',year:'numeric'}).format(d);
}
function filtroHF(k,v){
  if(['hfMinLikes','hfMinDownloads','hfMinGB','hfMaxGB'].includes(k))v=Math.max(0,Number(v)||0);
  S[k]=v; disegnaCentro();
}

const setMemoriaHF=v=>filtroHF('hfMemoria',v);

  Object.assign(S,{hfFormato:'tutti',hfMemoria:'tutti',hfEta:'tutte',hfAutore:'',

  disegnaCentro();
}
function cambiaOrdineHF(v){
  S.hfSort=v;
  /* Ordina subito i risultati già presenti; in parallelo chiede a HF il
     gruppo corretto per il nuovo criterio. Così il menu non sembra bloccato. */
  disegnaCentro();
  if(S.hfQuery)cerca();
}
function risultatiHF(){
  const adesso=Date.now(), giorni={sette:7,trenta:30,anno:365}[S.hfEta]||0;
  const autore=String(S.hfAutore||'').trim().toLowerCase();
  const vis=(S.hf||[]).filter(t=>{
    const peso=Number(t.gb)||0, formato=String(t.formato||'Altro/non indicato');
    if(S.hfFormato!=='tutti'&&formato!==S.hfFormato)return false;
    if(S.hfMemoria==='entra'&&(!peso||peso>disponibiliGB()))return false;
    if(S.hfMemoria==='liberare'&&(!peso||peso<=disponibiliGB()))return false;
    if(S.hfMemoria==='presenti'&&!t.giaPresente)return false;
    if(autore&&!String(t.id||'').split('/')[0].toLowerCase().includes(autore))return false;
    if((Number(t.likes)||0)<S.hfMinLikes||(Number(t.downloads)||0)<S.hfMinDownloads)return false;
    if(S.hfMinGB&&(!peso||peso<S.hfMinGB))return false;
    if(S.hfMaxGB&&(!peso||peso>S.hfMaxGB))return false;
    if(giorni){ const d=new Date(t.aggiornato||t.creato||0).getTime(); if(!d||adesso-d>giorni*86400000)return false; }
    return true;
  });
  const valore=(t)=>S.hfSort==='likes'?Number(t.likes)||0:S.hfSort==='downloads'?Number(t.downloads)||0:
    S.hfSort==='lastModified'?new Date(t.aggiornato||0).getTime()||0:Number(t.tendenza)||0;
  return vis.sort((a,b)=>valore(b)-valore(a));
}

async function cerca(){
  const q = ($('hfq')||{}).value || '';
  if(!q.trim()) return;
  const nuova=q.trim(), cambiata=nuova!==S.hfQuery, richiesta=++S.hfRichiesta;
  S.hfQuery=nuova; S.hfCercato=true; S.hfCercando=true; S.hfErrore='';
  if(cambiata){S.hf=[];S.hfFormato='tutti';}
  disegnaCentro();
  try{
    const dati=await api('/api/hf/cerca?q='+encodeURIComponent(nuova)+'&sort='+encodeURIComponent(S.hfSort)) || [];
    if(richiesta!==S.hfRichiesta)return;
    S.hf=dati;
  }catch(e){ if(richiesta===S.hfRichiesta){S.hf=[];S.hfErrore=e.message;} }
  if(richiesta!==S.hfRichiesta)return;
  S.hfCercando=false;
  disegnaCentro();
}
async function scarica(i){
  const t = S.hf[i]; if(!t) return;
  try{ await api('/api/modello/installa',{method:'POST',body:JSON.stringify({repo:t.id})}); }catch(e){ log('! '+e.message); }
  try{ S.scarichi = await api('/api/hf/stato') || []; }catch(e){}
  disegnaCentro();
}

async function apriDoc(i){

async function salvaDoc(scrivi){
  if(!S.doc) return;
  const corpo = {contenuto:$('editor').value, formato:S.doc.formato, revisione:S.docRev, soloValida:!scrivi};
  try{
    const r = await api('/api/documento?id='+encodeURIComponent(S.doc.id),{method:'POST',body:JSON.stringify(corpo)});
    S.docRev = r.revisione || S.docRev;
    $('valido').textContent = r.messaggio || T().validJSON;

  }catch(e){ $('valido').textContent = String(e.message); }

/* Il verdetto dell'arbitro come tabella: «se lo accendo adesso, ci sta?» */
function tabellaVerdetto(v){
  const righe=[[IT()?'serve':'needs',gb((v.richiestoByte||0)/1e9)+' GB'],[IT()?'liberi':'free',gb((v.disponibileByte||0)/1e9)+' GB']];
  if(!v.ammesso&&v.mancanoByte) righe.push([IT()?'mancano':'missing',gb(v.mancanoByte/1e9)+' GB']);
  if(!v.ammesso&&(v.daLiberare||[]).length) righe.push([IT()?'da spegnere':'to stop',v.daLiberare.map(nomeRuntime).join(' · ')]);
  return '<div><span class="pill '+(v.ammesso?'p-ok':'p-warn')+'">'+esc(v.ammesso?(IT()?'✓ ci sta':'✓ fits'):(IT()?'✕ non ci sta':'✕ does not fit'))+'</span>'
    +'<div class="specs" style="margin-top:7px">'+righe.map(([k,x])=>'<div>'+esc(k)+'</div><div>'+esc(x)+'</div>').join('')+'</div></div>';
}
/* Com'è finito l'ultimo gesto su questo modello: etichette, non un racconto. */
function esitoHTML(es,prog){
  if(!es.ok) return '<div class="avviso grave"><span>'+esc(es.errore||(IT()?'non riuscito':'failed'))+'</span></div>'
    +(es.verdetto?tabellaVerdetto(es.verdetto):'')
    +((es.restano||[]).length?'<div class="chips"><span class="k">'+esc(IT()?'ancora in memoria':'still loaded')+'</span>'
      +es.restano.map(x=>'<span class="chip">'+esc(cortoDi({id:x}))+'</span>').join('')+'</div>':'');
  const c=[];
  if(es.tipo==='accendi'){ c.push(IT()?'✓ acceso':'✓ on'); if(es.avviato)c.push(prog+(IT()?' avviato':' started')); if(es.sec)c.push(gb(es.sec)+' s'); }
  if(es.tipo==='spegni'){
    c.push(IT()?'✓ spento':'✓ off');
    if(es.programmaSpento)c.push(prog+(IT()?' spento':' stopped'));
    else if((es.restano||[]).length)c.push(prog+(IT()?' resta acceso · altri ':' stays on · other ')+es.restano.length);
  }
  if(es.tipo==='prova'){ c.push(gb(es.tokS)+' tok/s'); c.push(es.ragiona?(IT()?'ragiona':'reasons'):(IT()?'diretto':'straight')); }
  return chips(c,'ok');
}

/* Il preferito sta nel profilo del modello, sul server: vale nell'app e nel
   browser. La stella si disegna da ciò che il server risponde, non da ciò che
   si è chiesto; se non salva, lo dice nel dettaglio come ogni altro gesto. */
async function cambiaPreferito(id){
  const m = S.modelli.find(x=>x.id===id); if(!m) return;
  try{
    const r = await api('/api/preferito',{method:'POST',body:JSON.stringify({runtime:m.runtime,id:m.id,preferito:!m.preferito})});
    m.preferito=!!r.preferito; S.prefLocali[m.id]=m.preferito;
    if(S.esito[m.id]&&S.esito[m.id].tipo==='preferito') delete S.esito[m.id];
  }catch(e){ S.esito[m.id]={ok:false,tipo:'preferito',errore:(IT()?'Preferito non salvato: ':'Favorite not saved: ')+e.message}; }
  disegnaTutto();
}
function inspModello(){
  const m = modelloSel();
  if(!m) return '<div class="vuoto"><b>'+esc(T().noModels)+'</b></div>';
  const st=statoDi(m), cl=classeDi(m), remoto=remotoDi(m), acceso=accesoDi(m);
  const cr=S.cred[m.runtime]||{}, pr=S.provider[m.runtime]||{};
  const rt=S.runtime.find(r=>r.chiave===m.runtime)||{}, prog=rt.nome||m.runtime||'';
  const i=m.interruttore||{}, es=S.esito[m.id], inCorso=S.commutando[m.id];

  let h = '<div><div style="display:flex;align-items:center;gap:8px">'
    +'<button class="pill '+pillStato(st)+' chiedi" onclick="spiega(\''+st+'\')">'+esc(T().st[st])+'</button><span class="sp"></span>'
    +'<button class="b3 sm pref'+(m.preferito?' on':'')+'" aria-pressed="'+!!m.preferito+'" onclick="cambiaPreferito('+arg(m.id)+')"'
      +' title="'+esc(m.preferito?T().favRemove:T().favAdd)+'">'+(m.preferito?'★ '+esc(T().favorite):'☆ '+esc(T().favAdd))+'</button></div>'
    +'<h2 style="margin:9px 0 4px;line-height:1.25">'+esc(titoloDi(m))+'</h2>'
    +(m.id!==titoloDi(m)?'<div class="mono" style="font-size:10px;color:var(--accent-ink);word-break:break-all">'+esc(m.id)+'</div>':'')
    +(m.motivoCatalogo?'<p style="margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--body)">'+esc(m.motivoCatalogo)+'</p>':'')+'</div>';

  /* L'azione è una: accendi o spegni. Sotto c'è scritto cosa succede anche al
     programma, perché lo decide il server e non va scoperto dopo. */
  if(!remoto){
    const effetto = acceso ? (i.fermaProgramma ? [(IT()?'spegne anche ':'also stops ')+prog] : [])
                           : (i.avviaProgramma ? [(IT()?'avvia anche ':'also starts ')+prog] : []);
    h += '<div class="azioni">'+bottone(acceso?'b2':'b1','commuta('+arg(m.id)+')',
        inCorso ? '<span class="carica"></span> '+esc(inCorso==='on'?(IT()?'Accendo…':'Turning on…'):(IT()?'Spengo…':'Turning off…'))
                : esc(acceso?(IT()?'Spegni':'Turn off'):(IT()?'Accendi':'Turn on')),
        inCorso ? (IT()?'Operazione in corso.':'In progress.') : i.puo ? '' : bloccoTesto(i.blocco,prog), true)
      +chips(effetto)+'</div>';
    if(!acceso && m.verdetto) h += tabellaVerdetto(m.verdetto);
  }
  if(es) h += esitoHTML(es,prog);

  const specs = [
    [T().kProg, esc(prog+(rt.porta?' · :'+rt.porta:''))],
    [T().kClass, '<button class="tag chiedi" onclick="spiega(\''+cl+'\')">'+esc(T().cl[cl]||cl)+'</button>'],
    [T().kWeight, esc(remoto?T().elsewhere:(m.gb?gb(m.gb)+' GB':'—'))],
    [T().kSpeed, esc(m.misurato?gb(m.tokS)+' tok/s'+(m.provato?' · '+m.provato:''):'—')],
    [T().kCtx, esc(m.context?Math.round(m.context/1000)+'k':'—')],
    [T().kReason, esc(m.reasoning?(IT()?'sì':'yes'):'no')],
    [T().kClients, esc([m.inPi?'Pi':null, m.inOC?'OpenCode':null, m.inDSH?'DSH':null].filter(Boolean).join(' · ')||'—')]
  ];
  if(m.quantizzazione) specs.push(['quant', esc(m.quantizzazione)]);
  (m.alias||[]).forEach(a=>specs.push(['alias', esc(nomeRuntime(a.runtime)+' · '+a.id)]));
  h += '<div class="specs">'+specs.map(([k,x])=>'<div>'+esc(k)+'</div><div>'+x+'</div>').join('')+'</div>';

  /* la descrizione la scrive Gellow UNA volta e resta in profili.json */
  if(!remoto) h += '<div class="desc"><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
    +'<span class="k" style="flex:1">Gellow</span>'
    +bottone('b3 sm', 'ridescrivi('+arg(m.id)+')',
      S.descrivendo===m.id?'<span class="carica"></span>':'↻',
      S.descrivendo ? (IT()?'Gellow sta già descrivendo un modello.':'Gellow is already describing a model.') : '',
      true)+'</div><p>'+(m.note?esc(m.note):'<span style="color:var(--muted)">—</span>')+'</p></div>';

  if(remoto) h += '<div style="border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:7px">'
    +'<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="k">'+esc(T().keyLabel)+'</span>'
    +'<span class="mono" style="font-size:11px">'+esc(cr.coda?'…'+cr.coda:'—')+'</span>'
    +'<div class="sp"></div><span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px">'
    +'<span class="dot" style="background:'+(pr.risponde?'var(--ok)':'var(--bad)')+'"></span>'
    +esc(pr.risponde?(IT()?'risponde':'answering'):(pr.errore||(IT()?'non risponde':'not answering')))+'</span></div>'
    +'<div style="display:flex;gap:8px"><input id="chiave" type="password" placeholder="'+esc(T().keyNew)+'">'
    +'<button class="b2 sm" onclick="salvaChiave(\''+esc(m.runtime)+'\')">'+esc(T().keySave)+'</button></div></div>';

  /* Un pulsante che non può fare niente non deve essere premibile, e deve dire
     perché: passandoci sopra si legge il motivo. */
  h += '<div class="azioni"><div class="due">'
    +bottone('b2 sm', 'prova('+arg(m.id)+')',
      (S.provando===m.id?'<span class="carica"></span> ':'')+esc(T().testTime),
      S.provando ? (IT()?'Sto già cronometrando un modello.':'Already timing a model.') : '', true)
    +bottone('b3 sm', 'apriNomi()', T().namesClients, '')
    +'</div><div class="due">'
    +bottone(S.armato==='arch:'+m.id?'bx sm':'b3 bxq sm', 'archivia('+arg(m.id)+')',
      S.archiviando===m.id?'<span class="carica"></span>':(S.armato==='arch:'+m.id?T().confirm:T().archiveBtn),
      S.archiviando ? (IT()?'Archiviazione in corso.':'Archiving in progress.')
      : remoto ? (IT()?'I suoi file stanno su un\'altra macchina.':'Its files are on another machine.') : '',
      S.archiviando===m.id)
    +'</div></div>';
  if(S.erroreArchivio) h += '<div class="avviso grave"><span>'+esc(S.erroreArchivio)+'</span></div>';
  else if(S.armato==='arch:'+m.id&&S.esameArchivio) h += chips([
    (IT()?'sposta ':'moves ')+gb(S.esameArchivio.gbTotali)+' GB', S.esameArchivio.posti.length+(IT()?' cartelle':' folders'),
    IT()?'ripristinabile da Archivio':'restorable from Archive']);
  if(S.nomiAperti===m.id) h += formNomi(m);
  return h;
}
function formNomi(m){
  return '<div style="border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px">'
    +campo(T().yourName, 'et', m.etichetta||'')
    +campo(T().menuName, 'nm', m.nome||'')
    +campo(T().serverId, 'idm', m.id, T().idWarn)
    +'<label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="cpi" '+(m.inPi?'checked':'')+' style="width:auto;min-height:0"> '+esc(T().inPi)+'</label>'
    +'<label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="coc" '+(m.inOC?'checked':'')+' style="width:auto;min-height:0"> '+esc(T().inOC)+'</label>'
    +'<label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="cdsh" '+(m.inDSH?'checked':'')+' style="width:auto;min-height:0"> '+esc(T().inDSH)+'</label>'
    +'<button class="b1 sm" onclick="applicaNomi('+arg(m.id)+')">'+esc(T().saveChanges)+'</button></div>';
}
const campo = (etichetta,id,valore,aiuto) => '<label style="display:flex;flex-direction:column;gap:4px">'
  +'<span class="k">'+esc(etichetta)+'</span><input id="'+id+'" type="text" value="'+esc(valore)+'">'
  +(aiuto?'<span style="font-size:11px;color:var(--muted)">'+esc(aiuto)+'</span>':'')+'</label>';
function apriNomi(){ const m=modelloSel(); S.nomiAperti = S.nomiAperti===m.id?null:m.id; disegnaInsp(); }
async function applicaNomi(id){
  const m = S.modelli.find(x=>x.id===id); if(!m) return;
  const et=($('et')||{}).value||'', nm=($('nm')||{}).value||'', nuovo=($('idm')||{}).value||m.id;
  if(et!==m.etichetta){ try{ await api('/api/etichetta',{method:'POST',body:JSON.stringify({runtime:m.runtime,id:m.id,etichetta:et})}); m.etichetta=et; }catch(e){} }
  m.nome=nm; m.id=nuovo; m.inPi=($('cpi')||{}).checked; m.inOC=($('coc')||{}).checked; m.inDSH=($('cdsh')||{}).checked;
  S.cambiato=true; S.nomiAperti=null; S.sel=nuovo;
  disegnaTutto();
}
async function salva(){
  try{
    await api('/api/config',{method:'POST',body:JSON.stringify(S.modelli.filter(m=>m.inPi||m.inOC||m.inDSH))});
    S.cambiato=false;
    /* si ricarica invece di fidarsi della risposta: /api/config torna le voci
       nude, senza stato né classe, e assegnarle svuoterebbe la tabella. */
    return aggiorna();
  }catch(e){ log('! '+e.message); }
  disegnaTutto();
}
async function archivia(id){
  const m = S.modelli.find(x=>x.id===id); if(!m) return;
  S.erroreArchivio='';
  if(S.armato!=='arch:'+id){
    try{
      const e=await api('/api/modello/esamina?id='+encodeURIComponent(m.id));S.esameArchivio=e;
      if(!e||!(e.posti||[]).length){S.erroreArchivio=(e&&e.nota)||(IT()?'Non trovo i file sul disco.':'Files were not found on disk.');return disegnaInsp();}
      if(!e.rimovibile){
        const gravi=(e.dipendenze||[]).filter(x=>x.grave).map(x=>x.cosa+' — '+x.perche);
        S.erroreArchivio=gravi.join('; ')||(IT()?'Prima va liberato o disattivato.':'It must be unloaded or deactivated first.');return disegnaInsp();
      }
      S.armato='arch:'+id;return disegnaInsp();
    }catch(e){S.erroreArchivio=e.message;return disegnaInsp();}
  }
  S.armato='';S.archiviando=id;disegnaInsp();
  try{
    await api('/api/modello/rimuovi',{method:'POST',body:JSON.stringify({id:m.id,runtime:m.runtime})});
    S.archiviando='';S.inspAperto=false;S.schermo='archivio';await Promise.all([caricaLento(),aggiorna()]);
  }catch(e){S.archiviando='';S.erroreArchivio=e.message;disegnaInsp();}
}
async function salvaChiave(provider){
  const v = (($('chiave')||{}).value||'').trim(); if(!v) return;
  try{
    const r = await api('/api/credenziale',{method:'POST',body:JSON.stringify({provider,chiave:v})});
    log((r&&r.verifica)||'ok');
  }catch(e){ log('! '+e.message); }
  caricaLento();
}
/* nomi e descrizioni: le scrive il modellino e finiscono in profili.json, una
   volta. Senza `tutte` riempie solo i buchi; con un id rifà quel modello. */
async function etichetteAuto(tutte){
  vai('manutenzione');
  scriviConsole('> '+(IT()?'Gellow sta descrivendo i modelli':'Gellow is describing the models'));
  try{
    const r = await api('/api/etichetta-auto'+(tutte?'?tutte=1':''),{method:'POST'});
    ((r&&r.fatte)||[]).forEach(f => log('  '+f.id+(f.etichetta?' → '+f.etichetta:'')));
    log('> '+(IT()?'fatto, ':'done, ')+((r&&r.quante)||0));
  }catch(e){ log('! '+e.message); }
  aggiorna();
}
async function ridescrivi(id){
  if(S.descrivendo) return;
  S.descrivendo = id; disegnaInsp();
  try{ await api('/api/etichetta-auto?id='+encodeURIComponent(id),{method:'POST'}); }
  catch(e){ log('! '+e.message); }
  S.descrivendo = ''; await aggiorna();
}


function riprovaGellow(i){
  const m=S.chat[i]; if(m&&m.domanda)chiedi(m.domanda,m.contesto);
}
/* Gellow è un modello come gli altri: se il suo programma è spento lo si
   accende per la stessa strada dell'interruttore, e poi si rifà la domanda. */
async function accendiGellow(i){
  const a=S.aiuto||{};
  if(!a.modello||!a.runtime||S.commutando.gellow) return;
  S.commutando.gellow='on'; disegnaInsp();
  try{ await api('/api/modello/accendi',{method:'POST',body:JSON.stringify({modello:a.modello,runtime:a.runtime})}); }
  catch(e){ S.chat.push({io:0,testo:e.message}); }
  delete S.commutando.gellow;
  await aggiorna();
  if(gellowAcceso()) riprovaGellow(i); else disegnaInsp();
}
function inspAiuto(){
  const sugg = IT()?(S.domande||[]).slice(0,3):["What is in memory right now?","How much memory is free?","Why are there two Gemma models?"];
  const occupato = S.gellowOccupato ? (IT()?'Gellow sta già preparando una risposta.':'Gellow is already preparing an answer.') : '';
  const puoAccendere = !!(S.aiuto&&S.aiuto.modello&&S.aiuto.runtime);
  let h = S.chat.map((m,i)=>m.caricando
    ? '<div class="msg gellow-attesa" role="status" aria-live="polite"><span class="gellow-gira"></span><div><b>'
      +esc(m.controllo?(IT()?'Gellow sta leggendo tutto il controllo':'Gellow is reading the whole check'):(IT()?'Gellow sta preparando la risposta':'Gellow is preparing the answer'))
      +'<span class="gellow-punti" aria-hidden="true"><i></i><i></i><i></i></span></b><small id="gellow-tempo">'
      +esc(IT()?'meno di un secondo':'less than a second')+'</small></div></div>'
    : '<div '+(m.nuova?'id="gellow-risposta-nuova" ':'')+'class="msg'+(m.io?' io':' md')+'">'+(m.io?esc(m.testo):md(m.testo))
      +(m.programmi?'<div class="chips" style="margin-top:8px">'
        +bottone('b1 sm','accendiGellow('+i+')',S.commutando.gellow?'<span class="carica"></span>':esc(IT()?'Accendi Gellow':'Start Gellow'),
          S.commutando.gellow?(IT()?'Lo sto accendendo.':'Starting it.'):puoAccendere?'':(IT()?'Non so quale programma serve il suo modello.':'Its program is unknown.'),true)
        +bottone('b2 sm','riprovaGellow('+i+')',IT()?'Riprova':'Retry',occupato)+'</div>':'')
      +'</div>').join('');
  h += '<div class="sp"></div><div style="display:flex;gap:6px;flex-wrap:wrap">'
    +sugg.map(q=>'<button class="b3 sm" style="border:1px solid var(--line);font-size:10.5px" '+(occupato?'disabled title="'+esc(occupato)+'"':'')+' onclick="chiedi('+arg(q)+')">'
      +esc(q.length>34?q.slice(0,32)+'…':q)+'</button>').join('')+'</div>'
    +'<div style="display:flex;gap:8px"><input id="domanda" type="text" placeholder="'+esc(S.gellowOccupato?(IT()?'Gellow sta lavorando…':'Gellow is working…'):T().askPh)+'" '
    +(occupato?'disabled title="'+esc(occupato)+'" ':'')+'onkeydown="if(event.key===\'Enter\'&&!S.gellowOccupato){chiedi(this.value);this.value=\'\'}">'
    +'<button class="b1 sm" '+(occupato?'disabled title="'+esc(occupato)+'" ':'')+'onclick="var d=$(\'domanda\');chiedi(d.value);d.value=\'\'">'
    +esc(S.gellowOccupato?(IT()?'In corso…':'Working…'):T().send)+'</button></div>';
  return h;
}
/* markdown minimo: le risposte del modellino arrivano in MD */
function md(t){
  let s = esc(t);
  const blocchi=[];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocchi.push(c);return '\uE000'+(blocchi.length-1)+'\uE000';});
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(?:^[-*] .+\n?)+/gm,b=>'<ul>'+b.trim().split('\n').map(r=>'<li>'+r.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  s = s.split(/\n{2,}/).map(p=>/^<(ul|pre)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return s.replace(/\uE000(\d+)\uE000/g,(_,i)=>'<pre><code>'+blocchi[i]+'</code></pre>');
}

function disegnaPiede(){
  /* l'indirizzo è quello da cui la pagina è arrivata: la porta la decide la
     configurazione, e scriverla qui la farebbe mentire su un'altra macchina. */
  const dove = '<span class="k">'+esc(location.host||'127.0.0.1')+'</span>';
  $('metriche').innerHTML = totaleGB()
    ? metrica(T().used, gb(occupatiGB())+' / '+gb(totaleGB())+' GB')
      +metrica(T().available, gb(disponibiliGB())+' GB')
      +metrica(T().threshold, sogliaGB()+' GB', 'opz')
      +metrica(M().tettoDi?T().ceilingOf+' '+M().tettoDi:T().ceilingShort, tettoGB()?tettoGB()+' GB':'—', 'opz')
      +dove
    : dove;
  $('seg-tema').innerHTML = [['auto',T().themeAuto],['chiaro',T().themeLight],['scuro',T().themeDark]]
    .map(([k,n])=>'<button class="'+(S.tema===k?'on':'')+'" onclick="setTema(\''+k+'\')">'+esc(n)+'</button>').join('');
  $('seg-lingua').innerHTML = ['en','it']
    .map(k=>'<button class="'+(LINGUA===k?'on':'')+'" onclick="setLingua(\''+k+'\')">'+k.toUpperCase()+'</button>').join('');
}
function setTema(k){ S.tema=k; localStorage.setItem('tema',k); applicaTema(); disegnaPiede(); }
function setLingua(k){ LINGUA=k; localStorage.setItem('lingua',k); document.documentElement.lang=k; disegnaTutto(); }


/* ── palette ── */
function apriCmdk(v){
  $('velo').classList.toggle('on', !!v);
  if(v){ $('q').value=''; disegnaCmdk(); setTimeout(()=>$('q').focus(),30); }
}
let CMDK = {lista:[], sel:0, proposta:null};
function disegnaCmdk(){
  const r = interpreta($('q').value);
  CMDK.lista = r.lista || []; CMDK.proposta = r.proposta || null; CMDK.sel = 0;
  let h='';
  if(r.lettura && r.lettura.length) h += '<div class="capito"><span class="k">'+esc(T().understood)+'</span>'
    +r.lettura.map(x=>'<span class="v">'+esc(x)+'</span>').join('')+'</div>';
  if(r.proposta) h += '<div class="prop"><div style="flex:1;min-width:0"><b>'+esc(r.proposta.nome)+'</b>'
    +chips(r.proposta.dati||[])+'</div>'
    +'<button class="'+(r.proposta.pericolo?'bx':'b1')+' sm" onclick="eseguiProposta()">'+esc(T().confirm)+' ⏎</button></div>';
  h += '<div class="lista"><div class="k" style="padding:7px 12px 3px">'+esc(r.vuoto?T().commands:T().alsoThese)+'</div>'
    +CMDK.lista.map((c,i)=>'<button class="'+(i===CMDK.sel?'sel':'')+'" onclick="esegui(\''+esc(c.id)+'\')">'
      +'<span class="nm">'+esc(nomeCmd(c))+'</span><kbd>'+esc(c.gruppo)+'</kbd></button>').join('')+'</div>';
  $('cmdk-corpo').innerHTML = h;
  $('cmdk-piede').innerHTML = ['footChoose','footRun','footClose'].map(k=>'<span>'+esc(T()[k])+'</span>').join('')
    +'<span style="margin-left:auto">'+esc(T().footLocal)+'</span>';
}
function eseguiProposta(){ if(CMDK.proposta) esegui(CMDK.proposta.id, CMDK.proposta.extra); }
function tastiCmdk(e){
  if(e.key==='Enter'){ e.preventDefault(); return eseguiProposta(); }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    CMDK.sel = Math.max(0, Math.min(CMDK.lista.length-1, CMDK.sel + (e.key==='ArrowDown'?1:-1)));
    const b = document.querySelectorAll('#cmdk .lista button');
    b.forEach((x,i)=>x.classList.toggle('sel', i===CMDK.sel));
  }
}
addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); apriCmdk(true); }
  if(e.key==='Escape'){
    /* prima la palette, poi una conferma in sospeso, poi l'ispettore */
    const velo=$('velo');e.preventDefault();
    if(velo&&velo.classList.contains('on'))apriCmdk(false);
    else if(S.armato){ S.armato=''; disegnaTutto(); }
    else if(S.inspAperto)chiudiInsp();
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s' && S.schermo==='config'){ e.preventDefault(); salvaDoc(true); }
});
addEventListener('beforeunload', e=>{ if(S.cambiato){ e.preventDefault(); e.returnValue=''; } });

/* ── avvio ── */
document.documentElement.lang = LINGUA;
applicaTema();
setInterval(()=>{ if(S.tema==='auto' && !document.hidden) applicaTema(); }, 30000);
disegnaTutto();
aggiorna().then(()=>{ caricaLento(); avviaPolling(); });
</script>
