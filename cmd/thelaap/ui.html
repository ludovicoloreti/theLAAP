async function cerca(){
  const q = ($('hfq')||{}).value || '';
  if(!q.trim()) return;
  const nuova=q.trim(), cambiata=nuova!==S.hfQuery, richiesta=++S.hfRichiesta;
  S.hfQuery=nuova; S.hfCercato=true; S.hfCercando=true; S.hfErrore='';
  if(cambiata){S.hf=[];S.hfFormato='tutti';}
  disegnaCentro();
  try{
    const dati=await api('/api/hf/cerca?q='+encodeURIComponent(nuova)+'&sort='+encodeURIComponent(S.hfSort)) || [];
    if(richiesta!==S.hfRichiesta)return;
    S.hf=dati;
  }catch(e){ if(richiesta===S.hfRichiesta){S.hf=[];S.hfErrore=e.message;} }
  if(richiesta!==S.hfRichiesta)return;
  S.hfCercando=false;
  disegnaCentro();
}
async function scarica(i){
  const t = S.hf[i]; if(!t) return;
  try{ await api('/api/modello/installa',{method:'POST',body:JSON.stringify({repo:t.id})}); }catch(e){ log('! '+e.message); }
  try{ S.scarichi = await api('/api/hf/stato') || []; }catch(e){}
  disegnaCentro();
}

async function apriDoc(i){
  const x = S.documenti[i]; if(!x) return;
  try{
    S.doc = await api('/api/documento?id='+encodeURIComponent(x.id)+'&formato='+encodeURIComponent(x.formato||'json'));
    S.docRev = S.doc.revisione||'';
  }catch(e){ log('! '+e.message); }
  disegnaCentro();
}
function formatta(){
  const t = $('editor'); if(!t) return;
  try{ t.value = JSON.stringify(JSON.parse(t.value), null, 2)+'\n'; $('valido').textContent=T().validJSON; }
  catch(e){ $('valido').textContent = T().invalidJSON; }
}
async function salvaDoc(scrivi){
  if(!S.doc) return;
  const corpo = {contenuto:$('editor').value, formato:S.doc.formato, revisione:S.docRev, soloValida:!scrivi};
  try{
    const r = await api('/api/documento?id='+encodeURIComponent(S.doc.id),{method:'POST',body:JSON.stringify(corpo)});
    S.docRev = r.revisione || S.docRev;
    $('valido').textContent = r.messaggio || T().validJSON;
    if(scrivi) aggiorna();
  }catch(e){ $('valido').textContent = String(e.message); }
}

async function ripristina(i){

async function elimina(i){

/* ── inspector ── */
function disegnaInsp(){
  const corpo=$('insp-corpo'), vecchioTop=corpo.scrollTop;
  $('tab-modello').textContent = T().tabModel; $('tab-aiuto').textContent = T().tabHelp;
  $('tab-modello').className = S.tab==='modello'?'on':''; $('tab-aiuto').className = S.tab==='aiuto'?'on':'';
  corpo.innerHTML = S.tab==='aiuto' ? inspAiuto() : inspModello();
  if(S.tab==='aiuto'){
    if(S.gellowScroll==='fondo')corpo.scrollTop=corpo.scrollHeight;
    else if(S.gellowScroll==='risposta'){
      const nuova=$('gellow-risposta-nuova');corpo.scrollTop=nuova?Math.max(0,nuova.offsetTop-8):vecchioTop;
      const messaggio=S.chat.find(m=>m.nuova);if(messaggio)messaggio.nuova=false;
    }else corpo.scrollTop=Math.min(vecchioTop,Math.max(0,corpo.scrollHeight-corpo.clientHeight));
    S.gellowScroll='';
  }
}
function inspModello(){
  const m = modelloSel();
  if(!m) return '<div class="vuoto"><b>'+esc(T().noModels)+'</b>'+esc(T().noModelsWhy)+'</div>';
  const st=statoDi(m), cl=classeDi(m), tet=tettoGB(), remoto=remotoDi(m);
  const cr=S.cred[m.runtime]||{}, pr=S.provider[m.runtime]||{};
  const rt=S.runtime.find(r=>r.chiave===m.runtime)||{};
  /* «se lo carichi adesso»: la risposta è del verdetto che arriva con la
     scheda, non di un conto rifatto qui. Le due cose che il verdetto non sa —
     è remoto, non risponde all'id — le decide lo stato, che viene dallo stesso
     posto. */
  let v, vc;
  if(remoto){ vc='n-info'; v=[IT()?'Non passa da questa memoria':'It does not touch this memory',
      IT()?'Gira sul server del provider: non occupa RAM e da qui non si ferma.':'Runs on the provider server: no RAM used, no stopping it from here.']; }
  /* «guasto» ha tre cause diverse, e dirle insieme non aiuta nessuno: il
     programma non è dichiarato, è dichiarato ma spento, oppure è acceso e non
     conosce l'id. Sono tutte leggibili da quello che abbiamo già. */
  else if(st==='guasto'){ vc='n-bad';
    if(!rt.chiave) v=[IT()?'Il suo programma non è dichiarato qui':'Its program is not declared here',
      IT()?'«'+(m.runtime||'?')+'» non è fra i runtime in configurazione: il pannello non lo interroga, quindi non può dire se il modello c\'è. Aggiungilo, o togli la voce dai client.'
         :'"'+(m.runtime||'?')+'" is not among the runtimes in the config: the panel never asks it, so it cannot tell whether the model is there. Add it, or drop the entry from the clients.'];
    else if(!rt.attivo) v=[IT()?(rt.nome||m.runtime)+' è spento':(rt.nome||m.runtime)+' is off',
      IT()?'Finché il programma non è acceso nessuno serve questo modello. Accendilo dalla scheda Programmi.'
         :'While the program is off nobody serves this model. Start it from the Programs tab.'];
    else v=[IT()?'Non risponde a questo id':'Silent on this id',
      IT()?'Il programma è acceso ma non conosce l\'identificativo. Controlla il nome in configurazione.':'The program is on but does not know the id. Check the name in the config.']; }
  else if(st==='in-arrivo'){ vc='n-info'; v=[IT()?'Sta scaricando':'Downloading now',
      IT()?'Alla fine riavvia il suo programma, perché veda i file nuovi.':'Restart its program at the end so it sees the new files.']; }
  else if(st==='pronto'||st==='in-memoria'){ vc='n-ok'; v=[T().alreadyIn, T().alreadyInWhy]; }
  /* Programma spento: prima si accende, poi ha senso chiedersi se il modello
     ci sta. Chiederselo adesso darebbe una risposta su una macchina che fra un
     minuto è un'altra. Se il pannello non sa accenderlo, lo dice. */
  else if(st==='spento' && rt.chiave && !rt.attivo){ vc='n-warn';
    v=[(rt.nome||m.runtime)+(IT()?' è spento':' is off'),
      (IT()?'Il modello è dichiarato e a posto: manca solo il suo programma. ':'The model is declared and fine: only its program is missing. ')
      +(rt.puoAvviare ? (IT()?'Accendilo dalla scheda Programmi.':'Start it from the Programs tab.')
        : (IT()?'Il pannello non sa accenderlo: non ha i suoi comandi in configurazione.':'The panel cannot start it: its commands are not in the config.'))]; }
  else if(!haVerdetto(m)){ vc='n-warn'; v=[T().unknownWeight,
      IT()?'Non è mai stato misurato: senza il peso non posso dire se ci sta. Provalo una volta.'
         :'It was never measured: without a weight I cannot say whether it fits. Test it once.']; }
  else if(tet && (m.gb||0)>tet){ vc='n-bad'; v=[IT()?'Oltre il tetto per un solo modello':'Over the single model ceiling',
      IT()?'Servono '+gb(m.gb)+' GB, il tetto è '+tet+'. È il margine del programma, non la RAM.':'It needs '+gb(m.gb)+' GB, the ceiling is '+tet+'. That is the program margin, not the RAM.']; }
  else if(ciSta(m)){ vc='n-ok'; v=[IT()?'Ci sta adesso':'It fits now', motivoVerdetto(m)
      +(cl==='esclusivo'?(IT()?' Resta classe esclusivo.':' Still exclusive class.'):'')]; }
  else { vc='n-warn'; v=[mancanoGB(m)>0 ? (IT()?'Mancano ':'Missing ')+gb(mancanoGB(m))+' GB'
      : (IT()?'Non ci sta adesso':'It does not fit now'), motivoVerdetto(m)]; }

  const specs = [
    [T().kClass, T().cl[cl]+(cl==='esclusivo'?' · ≥ '+sogliaGB()+' GB':cl==='convivente'?' · < '+sogliaGB()+' GB'
      :cl==='ignota'?(IT()?' · provalo una volta e si sa':' · test it once and we know'):'')],
    [T().kWeight, remoto?T().elsewhere:(m.gb?gb(m.gb)+' GB':T().notWeighed)],
    [T().kSpeed, m.misurato?gb(m.tokS)+' tok/s'+(m.provato?' · '+m.provato:''):T().notMeasured],
    [T().kCtx, Math.round((m.context||0)/1024)+'k token'],
    [T().kProg, (rt.nome||m.runtime||'')+(S.modo==='esperto'&&rt.porta?' · '+T().port+' '+rt.porta:'')],
    [T().kReason, m.reasoning?T().yes:T().no],
    [T().kClients, [m.inPi?'Pi':null, m.inOC?'OpenCode':null].filter(Boolean).join(' · ')||T().none]
  ];
  let h = '<div><span class="pill '+pillStato(st)+'">'+esc(T().st[st])+'</span>'
    +'<h2 style="margin:9px 0 4px;line-height:1.25">'+esc(titoloDi(m))+'</h2>'
    +'<div class="mono" style="font-size:10px;color:var(--accent-ink);word-break:break-all">'+esc(m.id)+'</div></div>';
  /* la descrizione la scrive il modellino UNA volta e resta in profili.json:
     il riquadro c'è sempre, e se è vuoto dice come riempirlo. */
  if(!remoto) h += '<div class="desc"><div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'
    +'<span class="k" style="flex:1">'+esc(T().describedBy)+'</span>'
    +bottone('b3 sm', 'ridescrivi('+arg(m.id)+')',
      S.descrivendo===m.id?'<span class="carica"></span>':'↻',
      S.descrivendo ? (IT()?'Gellow sta già descrivendo un modello.':'Gellow is already describing a model.') : '',
      true)+'</div>'
    +'<p>'+(m.note?esc(m.note):'<span style="color:var(--muted)">'+esc(IT()?'Ancora nessuna: premi ↻ e la scrive Gellow.'
       :'None yet: press ↻ and Gellow writes it.')+'</span>')+'</p></div>';
  h += '<div class="specs">'+specs.map(([k,x])=>'<div>'+esc(k)+'</div><div>'+esc(x)+'</div>').join('')+'</div>';
  const inMemoria=st==='pronto'||st==='in-memoria';
  h += '<div><div class="k" style="margin-bottom:7px">'+esc(inMemoria?(IT()?'SE VUOI SPEGNERLO':'IF YOU WANT TO TURN IT OFF'):T().ifLoaded)+'</div>'+nota(vc,v[0],v[1])+'</div>';
  if(S.avvisoProva) h += nota('n-warn','',S.avvisoProva);
  if(S.esitoProva) h += nota('n-ok','',S.esitoProva);
  if(remoto) h += '<div style="border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:7px">'
    +'<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="k">'+esc(T().keyLabel)+'</span>'
    +'<span class="mono" style="font-size:11px">'+esc(cr.coda?T().keyEnds+' '+cr.coda:(IT()?'nessuna':'none'))+'</span>'
    +'<div class="sp"></div><span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px">'
    +'<span class="dot" style="background:'+(pr.risponde?'var(--ok)':'var(--bad)')+'"></span>'
    +esc(pr.risponde?(IT()?'risponde':'answering'):(pr.errore||(IT()?'non risponde':'not answering')))+'</span></div>'
    +'<div style="display:flex;gap:8px"><input id="chiave" type="password" placeholder="'+esc(T().keyNew)+'">'
    +'<button class="b2 sm" onclick="salvaChiave(\''+esc(m.runtime)+'\')">'+esc(T().keySave)+'</button></div>'
    +'<div style="font-size:11.5px;color:var(--muted);line-height:1.45">'+esc(T().keyNote)+'</div></div>';
  /* Un pulsante che non può fare niente non deve essere premibile, e deve dire
     perché: passandoci sopra si legge il motivo. Il difetto del 18/08/2026 non
     era che «Libera RAM» sbagliasse — era che non faceva nulla in silenzio,
     perché senza processi da fermare esegui('libera') esce senza una riga. */
  const capModello=S.capacita[m.runtime]||{};
  const puoDisattivare=!remoto&&(capModello.scaricaSingoloModello||puoFermare(m.runtime));
  const puoArchiviare = !remoto;
  h += '<div class="azioni">'
    +(inMemoria
      ? bottone('b2','disattiva('+arg(m.id)+')',
          S.spegnendo===m.id?'<span class="carica"></span> '+esc(IT()?'Disattivo…':'Deactivating…')
            :esc(capModello.scaricaSingoloModello?(IT()?'Disattiva modello':'Deactivate model'):(IT()?'Spegni '+nomeRuntime(m.runtime):'Stop '+nomeRuntime(m.runtime))),
          S.spegnendo?(IT()?'Sto già disattivando un modello.':'A model is already being deactivated.')
            :puoDisattivare?'':(IT()?'Il pannello non ha un comando per spegnerlo.':'The panel has no command to turn it off.'),true)
      : bottone('b1', 'esegui(\'pronto\',{id:'+arg(m.id)+'})',
          S.attivando===m.id?'<span class="carica"></span> '+esc(IT()?'Attivo…':'Activating…'):T().makeReady,
          S.attivando ? (IT()?'Sto già attivando un modello.':'A model is already being activated.')
          : remoto ? (IT()?'Gira sul server del provider: non c\'è niente da caricare qui.':'It runs on the provider server: nothing to load here.')
          : '',S.attivando===m.id))
    +'<div class="due">'
    +bottone('b2 sm', 'prova('+arg(m.id)+')',
      (S.provando===m.id?'<span class="carica"></span> ':'')+esc(T().testTime),
      S.provando ? (IT()?'Sto già cronometrando un modello.':'Already timing a model.') : '', true)
    +'</div><div class="due">'
    +bottone('b3 sm', 'apriNomi()', T().namesClients, '')
    +bottone(S.armato==='arch:'+m.id?'bx sm':'b3 bxq sm', 'archivia('+arg(m.id)+')',
      S.archiviando===m.id?'<span class="carica"></span>':(S.armato==='arch:'+m.id?T().pressAgain:T().archiveBtn),
      S.archiviando ? (IT()?'Archiviazione in corso.':'Archiving in progress.')
      : puoArchiviare ? '' : (IT()?'I suoi file stanno su un\'altra macchina: da qui non si archivia.':'Its files are on another machine: nothing to archive from here.'),
      S.archiviando===m.id)
    +'</div></div>';
  if(S.erroreArchivio)h+=nota('n-bad',IT()?'Non archiviato':'Not archived',S.erroreArchivio);
  else if(S.armato==='arch:'+m.id&&S.esameArchivio)h+=nota('n-warn',IT()?'Conferma archivio':'Confirm archive',
    (IT()?'Sposto ':'Move ')+S.esameArchivio.posti.length+(IT()?' posizione/i, ':' location(s), ')+gb(S.esameArchivio.gbTotali)+' GB. '+T().pressAgain+'.');
  if(S.nomiAperti===m.id) h += formNomi(m);
  return h;
}
function formNomi(m){
  return '<div style="border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px">'
    +campo(T().yourName, 'et', m.etichetta||'')
    +campo(T().menuName, 'nm', m.nome||'')
    +campo(T().serverId, 'idm', m.id, T().idWarn)
    +'<label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="cpi" '+(m.inPi?'checked':'')+' style="width:auto;min-height:0"> '+esc(T().inPi)+'</label>'
    +'<label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="coc" '+(m.inOC?'checked':'')+' style="width:auto;min-height:0"> '+esc(T().inOC)+'</label>'
    +'<button class="b1 sm" onclick="applicaNomi('+arg(m.id)+')">'+esc(T().saveChanges)+'</button></div>';
}
const campo = (etichetta,id,valore,aiuto) => '<label style="display:flex;flex-direction:column;gap:4px">'
  +'<span class="k">'+esc(etichetta)+'</span><input id="'+id+'" type="text" value="'+esc(valore)+'">'
  +(aiuto?'<span style="font-size:11px;color:var(--muted)">'+esc(aiuto)+'</span>':'')+'</label>';
function apriNomi(){ const m=modelloSel(); S.nomiAperti = S.nomiAperti===m.id?null:m.id; disegnaInsp(); }
async function applicaNomi(id){
  const m = S.modelli.find(x=>x.id===id); if(!m) return;
  const et=($('et')||{}).value||'', nm=($('nm')||{}).value||'', nuovo=($('idm')||{}).value||m.id;
  if(et!==m.etichetta){ try{ await api('/api/etichetta',{method:'POST',body:JSON.stringify({runtime:m.runtime,id:m.id,etichetta:et})}); m.etichetta=et; }catch(e){} }
  m.nome=nm; m.id=nuovo; m.inPi=($('cpi')||{}).checked; m.inOC=($('coc')||{}).checked;
  S.cambiato=true; S.nomiAperti=null; S.sel=nuovo;
  disegnaTutto();
}
async function salva(){
  try{
    await api('/api/config',{method:'POST',body:JSON.stringify(S.modelli.filter(m=>m.inPi||m.inOC))});
    S.cambiato=false;
    /* si ricarica invece di fidarsi della risposta: /api/config torna le voci
       nude, senza stato né classe, e assegnarle svuoterebbe la tabella. */
    return aggiorna();
  }catch(e){ log('! '+e.message); }
  disegnaTutto();
}
async function archivia(id){
  const m = S.modelli.find(x=>x.id===id); if(!m) return;
  S.erroreArchivio='';
  if(S.armato!=='arch:'+id){
    try{
      const e=await api('/api/modello/esamina?id='+encodeURIComponent(m.id));S.esameArchivio=e;
      if(!e||!(e.posti||[]).length){S.erroreArchivio=(e&&e.nota)||(IT()?'Non trovo i file sul disco.':'Files were not found on disk.');return disegnaInsp();}
      if(!e.rimovibile){
        const gravi=(e.dipendenze||[]).filter(x=>x.grave).map(x=>x.cosa+' — '+x.perche);
        S.erroreArchivio=gravi.join('; ')||(IT()?'Prima va liberato o disattivato.':'It must be unloaded or deactivated first.');return disegnaInsp();
      }
      S.armato='arch:'+id;return disegnaInsp();
    }catch(e){S.erroreArchivio=e.message;return disegnaInsp();}
  }
  S.armato='';S.archiviando=id;disegnaInsp();
  try{
    await api('/api/modello/rimuovi',{method:'POST',body:JSON.stringify({id:m.id,runtime:m.runtime})});
    S.archiviando='';S.inspAperto=false;S.schermo='archivio';await Promise.all([caricaLento(),aggiorna()]);
  }catch(e){S.archiviando='';S.erroreArchivio=e.message;disegnaInsp();}
}
async function salvaChiave(provider){
  const v = (($('chiave')||{}).value||'').trim(); if(!v) return;
  try{
    const r = await api('/api/credenziale',{method:'POST',body:JSON.stringify({provider,chiave:v})});
    log((r&&r.verifica)||'ok');
  }catch(e){ log('! '+e.message); }
  caricaLento();
}
/* nomi e descrizioni: le scrive il modellino e finiscono in profili.json, una
   volta. Senza `tutte` riempie solo i buchi; con un id rifà quel modello. */
async function etichetteAuto(tutte){
  vai('manutenzione');
  scriviConsole('> '+(IT()?'Gellow sta descrivendo i modelli':'Gellow is describing the models'));
  try{
    const r = await api('/api/etichetta-auto'+(tutte?'?tutte=1':''),{method:'POST'});
    ((r&&r.fatte)||[]).forEach(f => log('  '+f.id+(f.etichetta?' → '+f.etichetta:'')));
    log('> '+(IT()?'fatto, ':'done, ')+((r&&r.quante)||0));
  }catch(e){ log('! '+e.message); }
  aggiorna();
}
async function ridescrivi(id){
  if(S.descrivendo) return;
  S.descrivendo = id; disegnaInsp();
  try{ await api('/api/etichetta-auto?id='+encodeURIComponent(id),{method:'POST'}); }
  catch(e){ log('! '+e.message); }
  S.descrivendo = ''; await aggiorna();
}

function inspAiuto(){
  const sugg = (S.domande||[]).slice(0,3);
  let h = S.chat.length ? S.chat.map(m=>m.caricando
    ? '<div class="msg gellow-attesa" role="status" aria-live="polite"><span class="gellow-gira"></span><div><b>'
      +esc(m.controllo?(IT()?'Gellow sta leggendo tutto il controllo':'Gellow is reading the whole check'):(IT()?'Gellow sta preparando la risposta':'Gellow is preparing the answer'))
      +'<span class="gellow-punti" aria-hidden="true"><i></i><i></i><i></i></span></b><small id="gellow-tempo">'
      +esc(IT()?'meno di un secondo':'less than a second')+'</small></div></div>'
    : '<div '+(m.nuova?'id="gellow-risposta-nuova" ':'')+'class="msg'+(m.io?' io':' md')+'">'+(m.io?esc(m.testo):md(m.testo))+'</div>').join('')
    : '<div class="msg md"><b>Gellow</b><br>'+esc(IT()?'Vedo cosa sta facendo il Mac adesso. Chiedimi cosa c\'è in memoria, perché un modello non parte o cosa significa un controllo.'
        :'I can see what the Mac is doing right now. Ask me what is in memory, why a model will not start, or what a check means.')+'</div>';
  h += '<div class="sp"></div><div style="display:flex;gap:6px;flex-wrap:wrap">'
    +sugg.map(q=>'<button class="b3 sm" style="border:1px solid var(--line);font-size:10.5px" '+(S.gellowOccupato?'disabled title="'+esc(IT()?'Gellow sta già preparando una risposta.':'Gellow is already preparing an answer.')+'"':'')+' onclick="chiedi('+arg(q)+')">'
      +esc(q.length>34?q.slice(0,32)+'…':q)+'</button>').join('')+'</div>'
    +'<div style="display:flex;gap:8px"><input id="domanda" type="text" placeholder="'+esc(S.gellowOccupato?(IT()?'Gellow sta lavorando…':'Gellow is working…'):T().askPh)+'" '
    +(S.gellowOccupato?'disabled title="'+esc(IT()?'Aspetta la risposta in corso.':'Wait for the current answer.')+'" ':'')+'onkeydown="if(event.key===\'Enter\'&&!S.gellowOccupato){chiedi(this.value);this.value=\'\'}">'
    +'<button class="b1 sm" '+(S.gellowOccupato?'disabled title="'+esc(IT()?'Gellow sta già preparando una risposta.':'Gellow is already preparing an answer.')+'" ':'')+'onclick="var d=$(\'domanda\');chiedi(d.value);d.value=\'\'">'
    +esc(S.gellowOccupato?(IT()?'In corso…':'Working…'):T().send)+'</button></div>';
  return h;
}
/* markdown minimo: le risposte del modellino arrivano in MD */
function md(t){
  let s = esc(t);
  const blocchi=[];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocchi.push(c);return '\uE000'+(blocchi.length-1)+'\uE000';});
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(?:^[-*] .+\n?)+/gm,b=>'<ul>'+b.trim().split('\n').map(r=>'<li>'+r.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  s = s.split(/\n{2,}/).map(p=>/^<(ul|pre)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return s.replace(/\uE000(\d+)\uE000/g,(_,i)=>'<pre><code>'+blocchi[i]+'</code></pre>');
}

function disegnaPiede(){
  /* l'indirizzo è quello da cui la pagina è arrivata: la porta la decide la
     configurazione, e scriverla qui la farebbe mentire su un'altra macchina. */
  const dove = '<span class="k">'+esc(location.host||'127.0.0.1')+'</span>';
  $('metriche').innerHTML = totaleGB()
    ? metrica(T().used, gb(occupatiGB())+' / '+gb(totaleGB())+' GB')
      +metrica(T().available, gb(disponibiliGB())+' GB')
      +metrica(T().threshold, sogliaGB()+' GB', 'opz')
      +metrica(T().ceilingShort, tettoGB()?tettoGB()+' GB':'—', 'opz')
      +dove
    : dove;
  $('seg-tema').innerHTML = [['auto',T().themeAuto],['chiaro',T().themeLight],['scuro',T().themeDark]]
    .map(([k,n])=>'<button class="'+(S.tema===k?'on':'')+'" onclick="setTema(\''+k+'\')">'+esc(n)+'</button>').join('');
  $('seg-lingua').innerHTML = ['en','it']
    .map(k=>'<button class="'+(LINGUA===k?'on':'')+'" onclick="setLingua(\''+k+'\')">'+k.toUpperCase()+'</button>').join('');
}
function setTema(k){ S.tema=k; localStorage.setItem('tema',k); applicaTema(); disegnaPiede(); }
function setLingua(k){ LINGUA=k; localStorage.setItem('lingua',k); document.documentElement.lang=k; S.chat=[]; disegnaTutto(); }

/* ── palette ── */
function apriCmdk(v){
  $('velo').classList.toggle('on', !!v);
  if(v){ $('q').value=''; disegnaCmdk(); setTimeout(()=>$('q').focus(),30); }
}
let CMDK = {lista:[], sel:0, proposta:null};
function disegnaCmdk(){
  const r = interpreta($('q').value);
  CMDK.lista = r.lista || []; CMDK.proposta = r.proposta || null; CMDK.sel = 0;
  const sug = suggeriti();
  let h='';
  if(r.lettura && r.lettura.length) h += '<div class="capito"><span class="k">'+esc(T().understood)+'</span>'
    +r.lettura.map(x=>'<span class="v">'+esc(x)+'</span>').join('')+'</div>';
  if(r.proposta) h += '<div class="prop"><div style="flex:1;min-width:0"><b>'+esc(r.proposta.nome)+'</b>'
    +'<div class="c">'+esc(r.proposta.cosa)+'</div>'
    +(r.proposta.avviso?'<div class="w">'+esc(r.proposta.avviso)+'</div>':'')+'</div>'
    +'<button class="'+(r.proposta.pericolo?'bx':'b1')+' sm" onclick="eseguiProposta()">'+esc(T().confirm)+' ⏎</button></div>';
  if(r.vuoto && sug.length){
    window.SUGK = sug.map(s=>s.fa);
    h += '<div class="vedo"><div class="k" style="color:var(--accent-ink);margin-bottom:3px">'+esc(T().fromWhatISee)+'</div>'
      +sug.map((s,i)=>'<button onclick="SUGK['+i+']();apriCmdk(false)"><span class="fr">→</span><span style="flex:1;min-width:0">'
        +'<b>'+esc(s.nome)+'</b><i>'+esc(s.motivo)+'</i></span></button>').join('')+'</div>';
  }
  h += '<div class="lista"><div class="k" style="padding:7px 12px 3px">'+esc(r.vuoto?T().commands:T().alsoThese)+'</div>'
    +CMDK.lista.map((c,i)=>'<button class="'+(i===CMDK.sel?'sel':'')+'" onclick="esegui(\''+esc(c.id)+'\')">'
      +'<span class="nm">'+esc(nomeCmd(c))+'</span><kbd>'+esc(c.gruppo)+'</kbd></button>').join('')+'</div>';
  $('cmdk-corpo').innerHTML = h;
  $('cmdk-piede').innerHTML = ['footChoose','footRun','footClose'].map(k=>'<span>'+esc(T()[k])+'</span>').join('')
    +'<span style="margin-left:auto">'+esc(T().footLocal)+'</span>';
}
function eseguiProposta(){ if(CMDK.proposta) esegui(CMDK.proposta.id, CMDK.proposta.extra); }
function tastiCmdk(e){
  if(e.key==='Enter'){ e.preventDefault(); return eseguiProposta(); }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    CMDK.sel = Math.max(0, Math.min(CMDK.lista.length-1, CMDK.sel + (e.key==='ArrowDown'?1:-1)));
    const b = document.querySelectorAll('#cmdk .lista button');
    b.forEach((x,i)=>x.classList.toggle('sel', i===CMDK.sel));
  }
}
addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); apriCmdk(true); }
  if(e.key==='Escape'){
    const velo=$('velo');e.preventDefault();
    if(velo&&velo.classList.contains('aperto'))apriCmdk(false);
    else if(S.inspAperto)chiudiInsp();
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s' && S.schermo==='config'){ e.preventDefault(); salvaDoc(true); }
});
addEventListener('beforeunload', e=>{ if(S.cambiato){ e.preventDefault(); e.returnValue=''; } });

/* ── avvio ── */
document.documentElement.lang = LINGUA;
applicaTema();
setInterval(()=>{ if(S.tema==='auto' && !document.hidden) applicaTema(); }, 30000);
disegnaTutto();
aggiorna().then(()=>{ caricaLento(); avviaPolling(); });
</script>
